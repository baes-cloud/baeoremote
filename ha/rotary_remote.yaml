# Helpers for the two BæoRemote knobs (rotary-display-1 = Club, -2 = Bedroom).
# Live copy: /config/packages/rotary_remote.yaml
script:
  # Club's knob sends Club's new level plus the change since its last send;
  # every other room grouped with Club moves by that same change, so the
  # rooms keep their balance (like the Sonos app's group volume).
  rotary_volume:
    alias: "Rotary – group volume"
    icon: mdi:knob
    mode: queued
    max: 20
    fields:
      entity: {description: "Player the knob drives", example: media_player.club}
      level: {description: "Its new volume, 0-1", example: 0.3}
      delta: {description: "Change since the last send", example: 0.02}
    sequence:
      - action: media_player.volume_set
        target: {entity_id: "{{ entity }}"}
        data:
          volume_level: "{{ [[level | float(0), 0] | max, 1] | min }}"
      - variables:
          others: "{{ (state_attr(entity, 'group_members') or []) | reject('eq', entity) | list }}"
      - repeat:
          for_each: "{{ others }}"
          sequence:
            - action: media_player.volume_set
              continue_on_error: true
              target: {entity_id: "{{ repeat.item }}"}
              data:
                volume_level: >-
                  {{ [[(state_attr(repeat.item, 'volume_level') | float(0)) + (delta | float(0)), 0] | max, 1] | min | round(2) }}

  # Hold either knob: stop the music on every Sonos / Music Assistant player.
  # A Sonos on its TV input is left alone, so this never mutes the telly.
  rotary_stop_all:
    alias: "Rotary – stop all music"
    icon: mdi:stop-circle-outline
    mode: single
    sequence:
      - variables:
          players: >-
            {{ (integration_entities('sonos') + integration_entities('music_assistant'))
               | select('match', 'media_player\.')
               | select('is_state', ['playing', 'buffering'])
               | reject('is_state_attr', 'source', 'TV')
               | reject('is_state_attr', 'media_title', 'TV')
               | list }}
      - repeat:
          for_each: "{{ players }}"
          sequence:
            - action: media_player.media_stop
              continue_on_error: true
              target: {entity_id: "{{ repeat.item }}"}

  # Pick-to-play LPs on the knobs. The pick numbers match the LP order in
  # the firmware (tt/body.yaml pick_render): change both together.
  rotary_play:
    alias: "Rotary – play a pick"
    icon: mdi:album
    mode: single
    max_exceeded: silent
    fields:
      entity: {description: "Speaker to play on", example: media_player.club}
      pick: {description: "0 PDM London 2026 · 1 PDM Welcome to Paradise · 2 DFP In The House Of Love · 3 DFP Boiler Room · 4 Gay FM", example: 0}
    sequence:
      - choose:
          - conditions: "{{ pick | int(-1) == 0 }}"
            sequence:
              - action: media_player.play_media
                continue_on_error: true
                target: {entity_id: "{{ entity }}"}
                data:
                  media_content_id: "x-file-cifs://10.0.0.10/music/Purple%20Disco%20Machine%20%40%20Magazine%20Open%20Air,%20London%202026%20(Full%20Set).mp3"
                  media_content_type: music
          - conditions: "{{ pick | int(-1) == 1 }}"
            sequence:
              - action: media_player.play_media
                continue_on_error: true
                target: {entity_id: "{{ entity }}"}
                data: {media_content_id: "FV:2/9", media_content_type: favorite_item_id}
          - conditions: "{{ pick | int(-1) == 2 }}"
            sequence:
              - action: media_player.play_media
                continue_on_error: true
                target: {entity_id: "{{ entity }}"}
                data: {media_content_id: "FV:2/16", media_content_type: favorite_item_id}
          - conditions: "{{ pick | int(-1) == 3 }}"
            sequence:
              - action: media_player.play_media
                continue_on_error: true
                target: {entity_id: "{{ entity }}"}
                data: {media_content_id: "FV:2/26", media_content_type: favorite_item_id}
          - conditions: "{{ pick | int(-1) == 4 }}"
            sequence:
              - action: media_player.play_media
                continue_on_error: true
                target: {entity_id: "{{ entity }}"}
                data: {media_content_id: "FV:2/49", media_content_type: favorite_item_id}

      # YouTube Music / HLS picks can load and then sit paused: nudge until it plays
      - wait_template: "{{ is_state(entity, 'playing') }}"
        timeout: {seconds: 4}
      - repeat:
          while:
            - condition: template
              value_template: "{{ not is_state(entity, 'playing') and repeat.index <= 3 }}"
          sequence:
            - action: media_player.media_play
              continue_on_error: true
              target: {entity_id: "{{ entity }}"}
            - wait_template: "{{ is_state(entity, 'playing') }}"
              timeout: {seconds: 4}
