
# --------------------------------------------------------
# BÆO REMOTE (media-only, Nocturne face). One source, two remotes:
#   rotary-display-1 drives Club (volume moves every grouped room),
#   rotary-display-2 drives the Bedroom only. See tt/assemble.py.
# Knob: turn = volume, hold + turn = scrub, press = play/pause,
#   double = next, triple = previous, hold = stop music on every speaker.
# current_mode: 0 now-playing · 9 inert (night clock / alarm popup)
# idle -> dim face while playing, else the amber night clock (grp_night, top layer)
# --------------------------------------------------------
http_request:
  verify_ssl: false
  timeout: 2s

image:
  - file: "tt/art_ph.png"
    id: art_ph
    type: RGB565
  # pick-to-play LP labels (order = script.rotary_play pick numbers)
  - file: "tt/covers/pdm_london.png"
    id: cv_pdm_london
    type: RGB565
    transparency: alpha_channel
  - file: "tt/covers/pdm_paradise.png"
    id: cv_pdm_paradise
    type: RGB565
    transparency: alpha_channel
  - file: "tt/covers/dfp_love.png"
    id: cv_dfp_love
    type: RGB565
    transparency: alpha_channel
  - file: "tt/covers/dfp_boiler.png"
    id: cv_dfp_boiler
    type: RGB565
    transparency: alpha_channel
  - file: "tt/covers/gayfm.png"
    id: cv_gayfm
    type: RGB565
    transparency: alpha_channel

online_image:
  - id: album_blur
    url: "http://10.0.0.20:8123/local/rotary-no-art.jpg"
    format: AUTO
    type: RGB565
    resize: 24x24
    update_interval: never
    on_download_finished:
      - lambda: 'id(art_ok) = true;'
      - script.execute: {id: paint_bg, live: true}
    on_error:
      - lambda: 'id(art_ok) = false;'

globals:
  - id: alarm_state
    type: int
    initial_value: '0'
  - id: alarm_popup_up
    type: bool
    initial_value: 'false'
  - id: alarm_view_hidden
    type: bool
    initial_value: 'false'
  - id: alarm_pulse
    type: bool
    initial_value: 'false'
  - id: alarm_preview
    type: int
    initial_value: '0'
  - id: alarm_time_txt
    type: std::string
    initial_value: '"--:--"'
  - id: alarm_ampm_txt
    type: std::string
    initial_value: '""'
  - id: alarm_what_txt
    type: std::string
    initial_value: '""'
  - id: alarm_start_txt
    type: std::string
    initial_value: '""'
  - id: alarm_back_txt
    type: std::string
    initial_value: '""'
  - id: night_active
    type: bool
    initial_value: 'false'
  - id: night_armed
    type: bool
    initial_value: 'false'
  - id: nav_level              # kept for the alarm scripts; unused otherwise
    type: int
    initial_value: '0'
  - id: current_mode
    type: int
    initial_value: '0'
  - id: pa                     # scratch: mode captured at the start of an action
    type: int
    initial_value: '0'
  - id: media_playing
    type: bool
    initial_value: 'false'
  - id: media_is_tv
    type: bool
    initial_value: 'false'
  - id: last_title
    type: std::string
    initial_value: '""'
  - id: art_key                # "cache=" part of entity_picture last fetched
    type: std::string
    initial_value: '""'
  - id: art_ok                 # last album-art download succeeded
    type: bool
    initial_value: 'true'
  - id: vol_local              # 0..1, what the ticks show
    type: float
    initial_value: '0.3'
  - id: vol_touched_ms
    type: uint32_t
    initial_value: '0'
  - id: pos_s
    type: float
    initial_value: '0'
  - id: dur_s
    type: float
    initial_value: '0'
  - id: seek_touched_ms
    type: uint32_t
    initial_value: '0'
  - id: hud_active
    type: bool
    initial_value: 'false'
  - id: hud_kind               # 1 volume · 2 scrub
    type: int
    initial_value: '0'
  - id: turned_while_held
    type: bool
    initial_value: 'false'
  - id: vol_sent               # last level sent to HA (group volume moves by the difference)
    type: float
    initial_value: '0.3'
  - id: room_txt               # "CLUB" / "CLUB + LIVING ROOM" / "CLUB + 3 ROOMS"
    type: std::string
    initial_value: '"${room_name}"'
  - id: toast_ms               # artist line shows a toast until then
    type: uint32_t
    initial_value: '0'
  - id: hold_hint
    type: bool
    initial_value: 'false'
  - id: pick_sel               # pick-to-play: which LP is in the middle
    type: int
    initial_value: '0'
  - id: pick_open_ms           # taps right after opening don't count as a pick
    type: uint32_t
    initial_value: '0'
  - id: user_wake              # this wake came from a hand on the knob / glass
    type: bool
    initial_value: 'false'
  - id: wake_by_user
    type: bool
    initial_value: 'false'
  - id: pick_started_ms        # a pick was just sent: give Sonos time to start it
    type: uint32_t
    initial_value: '0'
  - id: paused_ms              # when the player went to paused (0 = not paused)
    type: uint32_t
    initial_value: '0'
  - id: pick_ok                # picker allowed on a touch / press (set by pick_check)
    type: bool
    initial_value: 'false'
  - id: pick_turn_ok           # ...and on a knob turn (never on TV: the turn stays volume)
    type: bool
    initial_value: 'false'
  - id: tx0                    # touch start / latest x, for swipes on the picker
    type: int
    initial_value: '0'
  - id: tx1
    type: int
    initial_value: '0'
  - id: swipe_ms               # a swipe just happened: the tap under it doesn't count
    type: uint32_t
    initial_value: '0'
  - id: tv_title               # what's on the TV (borrowed from Plex / the Streamer)
    type: std::string
    initial_value: '""'
  - id: tv_sub
    type: std::string
    initial_value: '""'
  - id: tv_pic
    type: std::string
    initial_value: '""'

script:
@@ALARM_SCRIPTS@@
  # ══ IDLE -> NIGHT CLOCK (unchanged behaviour) ══════════════════════════════
  - id: screen_timeout_timer
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(night_active);'}
          then:
            - script.execute: wake_from_night
          else:
            - lambda: 'id(user_wake) = false;'
            - script.execute: apply_awake_brightness
      - delay: ${night_idle}
      - if:
          condition: {lambda: 'return id(party_mode).state;'}
          then:
            - if:
                condition: {lambda: 'return id(current_mode) != 0 && id(current_mode) != 9;'}
                then: [{script.execute: switch_to_now}]
          else:
            - if:
                condition: {lambda: 'return id(alarm_state) != 1;'}
                then:
                  # music playing: keep the now-playing face, just dim it
                  - if:
                      condition: {lambda: 'return id(media_playing);'}
                      then: [{script.execute: dim_while_playing}]
                      else: [{script.execute: enter_night}]

  # Day: 40% backlight. 22:00-07:00: the "Night Brightness" slider.
  - id: dim_while_playing
    then:
      - if:
          condition: {lambda: 'return !id(night_active) && id(current_mode) == 0;'}
          then:
            - light.control:
                id: display_backlight
                brightness: !lambda |-
                  auto t = id(ha_time).now();
                  bool late = t.is_valid() && (t.hour >= 22 || t.hour < 7);
                  return late ? id(night_brightness).state / 100.0f : 0.4f;

  - id: apply_awake_brightness
    then:
      - if:
          condition: {lambda: 'return !id(night_active);'}
          then:
            - light.control:
                id: display_backlight
                brightness: !lambda 'return id(media_is_tv) ? 0.5f : 1.0f;'

  - id: enter_night
    then:
      - if:
          condition: {lambda: 'return !id(party_mode).state;'}
          then:
            - lambda: |-
                id(night_active) = true;
                id(current_mode) = 9;
            - script.execute: update_night_clock
            - lvgl.widget.show: grp_night
            # the "Night Brightness" slider is for 22:00-07:00; by day the idle
            # clock stays readable (never below 40%)
            - light.control:
                id: display_backlight
                brightness: !lambda |-
                  auto t = id(ha_time).now();
                  bool late = t.is_valid() && (t.hour >= 22 || t.hour < 7);
                  float nb = id(night_brightness).state / 100.0f;
                  return late ? nb : (nb > 0.4f ? nb : 0.4f);

  - id: wake_from_night
    mode: restart
    then:
      - lambda: 'id(night_active) = false; id(wake_by_user) = id(user_wake); id(user_wake) = false;'
      - script.execute: pick_check
      - light.control:
          id: display_backlight
          brightness: !lambda 'return id(media_is_tv) ? 0.5f : 1.0f;'
      # the waking touch / turn / press is swallowed
      - delay: 350ms
      - lvgl.widget.hide: grp_night
      - if:
          condition: {lambda: 'return id(alarm_popup_up);'}
          then: [{lambda: 'id(current_mode) = 9;'}]
          else:
            - if:
                condition: {lambda: 'return id(wake_by_user) && id(pick_turn_ok);'}
                then: [{script.execute: open_picker}]
                else: [{script.execute: switch_to_now}]

  - id: update_night_clock
    then:
      - lvgl.label.update:
          id: night_clock_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char b[8];
            snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            return std::string(b);

  - id: update_clock
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          char b[8];
          if (t.is_valid()) snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
          else snprintf(b, sizeof(b), "--:--");
          lv_label_set_text((lv_obj_t *) id(noc_clk), b);

  # ══ FACES ═══════════════════════════════════════════════════════════════
  # The night face, painted once at boot into an RGB565 canvas.
  # A little hash dither keeps the smooth gradients from banding in 16-bit.
  - id: paint_faces
    then:
      - lambda: |-
          auto hsh = [](uint32_t v) { v ^= v >> 16; v *= 0x7feb352d; v ^= v >> 15; v *= 0x846ca68b; v ^= v >> 16; return v; };
          // 3-stop gradient: c0 at 0, c1 at m, c2 at 1
          auto grad = [](float t, const float *c0, const float *c1, const float *c2, float m, float *o) {
            t = t < 0 ? 0 : (t > 1 ? 1 : t);
            if (t < m) { float u = t / m; for (int i = 0; i < 3; i++) o[i] = c0[i] + (c1[i] - c0[i]) * u; }
            else { float u = (t - m) / (1 - m); for (int i = 0; i < 3; i++) o[i] = c1[i] + (c2[i] - c1[i]) * u; }
          };
          const float RF = 215.0f;                                   // face radius; bezel beyond
          const float n0[3] = {0x0E, 0x0A, 0x08}, n1[3] = {0x07, 0x05, 0x04}, n2[3] = {0x03, 0x02, 0x02};   // night
          const float b0[3] = {0x2A, 0x2A, 0x2E}, b2[3] = {0x0B, 0x0B, 0x0C};                               // bezel
          lv_obj_t *cvs[1] = {(lv_obj_t *) id(nt_cv)};
          for (int k = 0; k < 1; k++) {
            lv_draw_buf_t *db = lv_canvas_get_draw_buf(cvs[k]);
            if (db == nullptr) continue;
            for (int y = 0; y < 480; y++) {
              uint16_t *row = (uint16_t *) (db->data + y * db->header.stride);
              if ((y & 31) == 0) App.feed_wdt();
              for (int x = 0; x < 480; x++) {
                float dx = x - 240, dy = y - 240, r = sqrtf(dx * dx + dy * dy);
                float c[3];
                if (r >= RF) {
                  // dark radial bezel, a touch lighter towards the face and the top left
                  float t = (r - RF) / (240.0f - RF), lit = r > 0 ? -(dx * 0.5f + dy * 0.85f) / r : 0;
                  for (int i = 0; i < 3; i++) c[i] = b0[i] + (b2[i] - b0[i]) * t + lit * 5.0f;
                  if (r < RF + 1.5f) for (int i = 0; i < 3; i++) c[i] *= 0.55f;          // fine seam
                } else {
                  grad(r / 304.0f, n0, n1, n2, 0.60f, c);
                }
                uint32_t nz = hsh(x * 7919u + y * 104729u);
                float d = ((nz & 255) / 255.0f - 0.5f) * 7.0f;               // ~1 LSB of RGB565
                int ci[3];
                for (int i = 0; i < 3; i++) { float v = c[i] + d; ci[i] = v < 0 ? 0 : (v > 255 ? 255 : (int) v); }
                row[x] = lv_color_to_u16(lv_color_make(ci[0], ci[1], ci[2]));
              }
            }
            lv_obj_invalidate(cvs[k]);
          }
          // Manrope Light numerals run a little tight (-2 px); YAML won't take negative tracking
          for (lv_obj_t *o : {(lv_obj_t *) id(night_clock_lbl), (lv_obj_t *) id(noc_num)})
            lv_obj_set_style_text_letter_space(o, -2, LV_PART_MAIN);

  # Nocturne background: the (tiny) album art blown up to the whole screen with a
  # cubic B-spline, which is smooth by construction, so it reads as a soft blur
  # instead of LVGL's blocky zoom. live=false paints the placeholder.
  - id: paint_bg
    parameters:
      live: bool
    then:
      - lambda: |-
          image::Image *im = live ? static_cast<image::Image *>(id(album_blur)) : id(art_ph);
          int w = im->get_width(), h = im->get_height();
          lv_draw_buf_t *db = lv_canvas_get_draw_buf((lv_obj_t *) id(noc_bg));
          if (db == nullptr || w < 2 || h < 2) return;
          float *src = (float *) heap_caps_malloc(w * h * 3 * sizeof(float), MALLOC_CAP_SPIRAM);
          float *tmp = (float *) heap_caps_malloc(h * 480 * 3 * sizeof(float), MALLOC_CAP_SPIRAM);
          if (src == nullptr || tmp == nullptr) { free(src); free(tmp); return; }
          for (int y = 0; y < h; y++)
            for (int x = 0; x < w; x++) {
              Color p = im->get_pixel(x, y);
              float *s = src + (y * w + x) * 3; s[0] = p.r; s[1] = p.g; s[2] = p.b;
            }
          // centred square crop, zoomed a touch so the edges fall off-screen (cover)
          float m = (w < h ? w : h) * 0.92f, x0 = (w - m) / 2.0f, y0 = (h - m) / 2.0f, sc = m / 480.0f;
          auto wts = [](float t, float *k) {
            float t2 = t * t, t3 = t2 * t, u = 1 - t;
            k[0] = u * u * u / 6; k[1] = (3 * t3 - 6 * t2 + 4) / 6; k[2] = (-3 * t3 + 3 * t2 + 3 * t + 1) / 6; k[3] = t3 / 6;
          };
          auto cl = [](int v, int n) { return v < 0 ? 0 : (v >= n ? n - 1 : v); };
          for (int x = 0; x < 480; x++) {                       // pass 1: rows -> 480 wide
            float u = x0 + (x + 0.5f) * sc - 0.5f; int i = (int) floorf(u); float k[4]; wts(u - i, k);
            for (int y = 0; y < h; y++) {
              float *o = tmp + (y * 480 + x) * 3; o[0] = o[1] = o[2] = 0;
              for (int q = 0; q < 4; q++) { const float *s = src + (y * w + cl(i - 1 + q, w)) * 3; o[0] += s[0] * k[q]; o[1] += s[1] * k[q]; o[2] += s[2] * k[q]; }
            }
          }
          auto hsh = [](uint32_t v) { v ^= v >> 16; v *= 0x7feb352d; v ^= v >> 15; v *= 0x846ca68b; v ^= v >> 16; return v; };
          for (int y = 0; y < 480; y++) {                       // pass 2: columns -> 480 tall
            if ((y & 31) == 0) App.feed_wdt();
            float v = y0 + (y + 0.5f) * sc - 0.5f; int j = (int) floorf(v); float k[4]; wts(v - j, k);
            const float *r0 = tmp + cl(j - 1, h) * 1440, *r1 = tmp + cl(j, h) * 1440, *r2 = tmp + cl(j + 1, h) * 1440, *r3 = tmp + cl(j + 2, h) * 1440;
            uint16_t *row = (uint16_t *) (db->data + y * db->header.stride);
            for (int x = 0; x < 480; x++) {
              int ci[3]; float d = ((hsh(x * 7919u + y * 104729u) & 255) / 255.0f - 0.5f) * 7.0f;
              for (int c = 0; c < 3; c++) {
                float f = r0[x * 3 + c] * k[0] + r1[x * 3 + c] * k[1] + r2[x * 3 + c] * k[2] + r3[x * 3 + c] * k[3] + d;
                ci[c] = f < 0 ? 0 : (f > 255 ? 255 : (int) f);
              }
              row[x] = lv_color_to_u16(lv_color_make(ci[0], ci[1], ci[2]));
            }
          }
          free(src); free(tmp);
          lv_obj_invalidate((lv_obj_t *) id(noc_bg));

  # Nocturne: dark radial wash + a faint top-left reflection over the cover bloom
  - id: paint_vignette
    then:
      - lambda: |-
          lv_draw_buf_t *db = lv_canvas_get_draw_buf((lv_obj_t *) id(noc_vig));
          if (db == nullptr) return;
          for (int y = 0; y < 480; y++) {
            uint32_t *row = (uint32_t *) (db->data + y * db->header.stride);
            if ((y & 31) == 0) App.feed_wdt();
            for (int x = 0; x < 480; x++) {
              float dx = x - 240, dy = y - 240, r = sqrtf(dx * dx + dy * dy);
              if (r >= 222.0f) {                           // glossy black band around the glass
                float ny = dy / r;
                int v = 7 + (int) ((r < 224.0f ? (224.0f - r) : 0) * 3) + (int) (-ny * 5);
                v = v < 3 ? 3 : v;
                row[x] = 0xFF000000u | ((uint32_t) v << 16) | ((uint32_t) v << 8) | (uint32_t) (v + 1);
              } else {                                     // smoked glass: darker towards the band
                float q = r / 222.0f;
                float a = 0.46f + 0.44f * q * q;
                float rx = (x - 150) / 200.0f, ry = (y - 20) / 120.0f, g = 1.0f - (rx * rx + ry * ry);
                if (g > 0) {
                  float gl = g * 0.08f;
                  uint8_t w = (uint8_t) (255 * gl / (a + gl));
                  row[x] = ((uint32_t) (uint8_t) ((a + gl) * 255) << 24) | ((uint32_t) w << 16) | ((uint32_t) w << 8) | w;
                } else row[x] = ((uint32_t) (uint8_t) (a * 255) << 24) | 0x050506;
              }
            }
          }
          lv_obj_invalidate((lv_obj_t *) id(noc_vig));

  # nudge the whole UI vertically so it sits centred in the physical ring
  - id: apply_offset
    then:
      - lambda: |-
          int dy = (int) id(screen_offset_y).state;
          lv_obj_t *roots[2] = {lv_screen_active(), lv_layer_top()};
          for (auto root : roots) {
            uint32_t n = lv_obj_get_child_count(root);
            for (uint32_t i = 0; i < n; i++) lv_obj_set_style_translate_y(lv_obj_get_child(root, i), dy, LV_PART_MAIN);
          }

  - id: set_face
    then:
      - lambda: 'lv_obj_remove_flag((lv_obj_t *) id(grp_noc), LV_OBJ_FLAG_HIDDEN);'
      - script.execute: update_np
      - script.execute: update_clock

  # knob turned / scrubbed: big numeral + lit volume
  - id: face_hud
    then:
      - lambda: |-
          char b[16];
          if (id(hud_kind) == 1) snprintf(b, sizeof(b), "%d", (int) roundf(id(vol_local) * 100));
          else { int t = (int) id(pos_s); snprintf(b, sizeof(b), "%d:%02d", t / 60, t % 60); }
          int v = (int) roundf(id(vol_local) * 100);
          {
            lv_label_set_text((lv_obj_t *) id(noc_num), b);
            lv_obj_remove_flag((lv_obj_t *) id(noc_num), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag((lv_obj_t *) id(noc_title), LV_OBJ_FLAG_HIDDEN); lv_obj_add_flag((lv_obj_t *) id(noc_artist), LV_OBJ_FLAG_HIDDEN);
            lv_arc_set_value((lv_obj_t *) id(noc_ring), v);
            lv_obj_set_style_arc_width((lv_obj_t *) id(noc_ring), 3, LV_PART_INDICATOR);
            lv_arc_set_value((lv_obj_t *) id(noc_glow), v);
          }

  - id: face_hud_end
    then:
      - lambda: |-
          lv_obj_add_flag((lv_obj_t *) id(noc_num), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag((lv_obj_t *) id(noc_title), LV_OBJ_FLAG_HIDDEN); lv_obj_remove_flag((lv_obj_t *) id(noc_artist), LV_OBJ_FLAG_HIDDEN);
          lv_obj_set_style_arc_width((lv_obj_t *) id(noc_ring), 2, LV_PART_INDICATOR);

  # ══ NAVIGATION ════════════════════════════════════════════════════════════
  # The alarm scripts call switch_to_home; it is the now-playing deck now.
  - id: switch_to_home
    then: [{script.execute: switch_to_now}]

  - id: switch_to_now
    then:
      - script.stop: pick_timeout
      - lambda: |-
          id(current_mode) = 0;
          lv_obj_add_flag((lv_obj_t *) id(pk_grp), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag((lv_obj_t *) id(noc_title), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag((lv_obj_t *) id(noc_artist), LV_OBJ_FLAG_HIDDEN);
      - script.execute: update_np
      - script.execute: update_clock

  # ══ PICK TO PLAY ══════════════════════════════════════════════════════════
  # Nothing playing + a hand on the knob or glass: little LPs to choose from.
  # Turn = browse, press or tap the middle one = play, hold = back.
  # When the picker may open. Club (pick_more): stopped, paused for over a
  # minute, or on the TV input. Bedroom: whenever nothing is playing.
  - id: pick_check
    then:
      - lambda: |-
          bool paused = id(media_state).state == "paused", tv = id(media_is_tv);
          if (${pick_more}) {
            bool long_pause = paused && id(paused_ms) != 0 && millis() - id(paused_ms) > 60000;
            id(pick_ok) = (!id(media_playing) && !tv && !paused) || long_pause || tv;
            id(pick_turn_ok) = id(pick_ok) && !tv;
          } else {
            id(pick_ok) = !id(media_playing) && !tv;
            id(pick_turn_ok) = id(pick_ok);
          }
          // a pick is still starting (streams can take a few seconds): don't reopen
          if (id(pick_started_ms) != 0 && millis() - id(pick_started_ms) < 15000 && !id(media_playing))
            id(pick_ok) = id(pick_turn_ok) = false;

  - id: open_picker
    then:
      - lambda: |-
          id(current_mode) = 5;
          id(pick_open_ms) = millis();
          lv_obj_add_flag((lv_obj_t *) id(noc_title), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag((lv_obj_t *) id(noc_artist), LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag((lv_obj_t *) id(noc_num), LV_OBJ_FLAG_HIDDEN);
          lv_obj_remove_flag((lv_obj_t *) id(pk_grp), LV_OBJ_FLAG_HIDDEN);
      - script.execute: pick_render
      - script.execute: update_np
      - script.execute: pick_timeout

  - id: pick_timeout
    mode: restart
    then:
      - delay: 20s
      - if:
          condition: {lambda: 'return id(current_mode) == 5;'}
          then: [{script.execute: switch_to_now}]

  - id: pick_move
    parameters:
      dir: int
    then:
      - lambda: 'id(pick_sel) = (id(pick_sel) + dir + 5) % 5;'
      - script.execute: pick_render
      - script.execute: pick_timeout

  - id: pick_render
    then:
      - lambda: |-
          static image::Image *const cv[5] = {id(cv_pdm_london), id(cv_pdm_paradise), id(cv_dfp_love), id(cv_dfp_boiler), id(cv_gayfm)};
          int s = id(pick_sel);
          lv_image_set_src((lv_obj_t *) id(pk_c_cv), cv[s]->get_lv_image_dsc());
          lv_image_set_src((lv_obj_t *) id(pk_l_cv), cv[(s + 4) % 5]->get_lv_image_dsc());
          lv_image_set_src((lv_obj_t *) id(pk_r_cv), cv[(s + 1) % 5]->get_lv_image_dsc());

  # taps on the LPs: middle = play, sides = bring it to the middle
  - id: pick_tap
    mode: restart
    parameters:
      which: int
    then:
      - delay: 80ms
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && millis() - id(swipe_ms) > 300;'}
          then:
            - script.execute: screen_timeout_timer
            - if:
                condition: {lambda: 'return which == 0;'}
                then: [{script.execute: pick_play}]
                else: [{script.execute: {id: pick_move, dir: !lambda 'return which;'}}]

  - id: pick_play
    then:
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && millis() - id(pick_open_ms) > 600;'}
          then:
            - homeassistant.action:
                action: script.rotary_play
                data:
                  entity: "${player}"
                  pick: !lambda 'return id(pick_sel);'
            - lambda: 'id(pick_started_ms) = millis();'
            - script.execute: switch_to_now
            - script.execute: {id: toast, msg: "STARTING"}

  # ══ INPUT ═════════════════════════════════════════════════════════════════
  - id: knob_turn
    parameters:
      dir: int
    then:
      - lambda: 'id(user_wake) = true;'
      - script.execute: screen_timeout_timer
      - script.execute: pick_check
      - lambda: |-
          id(pa) = id(current_mode);
          if (id(rotary_button).state) { id(turned_while_held) = true; id(pa) += 100; }
          // nothing playing: the first turn opens the picker instead of moving the volume
          if (id(pa) == 0 && id(pick_turn_ok)) id(pa) = 50;
      - if:
          condition: {lambda: 'return id(pa) == 50;'}
          then: [{script.execute: open_picker}]
      - if:
          condition: {lambda: 'return id(pa) == 5 || id(pa) == 105;'}
          then: [{script.execute: {id: pick_move, dir: !lambda 'return dir;'}}]
      # now playing: volume
      - if:
          condition: {lambda: 'return id(pa) == 0;'}
          then:
            - lambda: |-
                float v = id(vol_local) + dir * 0.02f;
                id(vol_local) = v < 0 ? 0 : (v > 1 ? 1 : v);
                id(vol_touched_ms) = millis();
            - script.execute: {id: hud_show, kind: 1}
            - script.execute: vol_send
      # now playing + held: scrub through the track
      - if:
          condition: {lambda: 'return id(pa) == 100 && id(dur_s) > 0;'}
          then:
            - lambda: |-
                float step = id(dur_s) / 60.0f; if (step < 5) step = 5;
                float p = id(pos_s) + dir * step;
                id(pos_s) = p < 0 ? 0 : (p > id(dur_s) - 1 ? id(dur_s) - 1 : p);
                id(seek_touched_ms) = millis();
            - script.execute: {id: hud_show, kind: 2}
            - script.execute: seek_send
      # turning cancels a pending "hold to stop" (hold + turn = scrub)
      - if:
          condition: {lambda: 'return id(hold_hint);'}
          then: [{script.execute: hold_hint_end}]

  - id: knob_press
    then:
      - lambda: 'id(user_wake) = true;'
      - script.execute: screen_timeout_timer
      - script.execute: pick_check
      - lambda: |-
          id(pa) = id(current_mode);
          // picker when allowed; a Bedroom pause (any length) still just resumes
          bool paused = id(media_state).state == "paused";
          if (id(pa) == 0 && id(pick_ok) && (${pick_more} || !paused)) id(pa) = 50;
          // a pick is still starting: a second press would pause it
          if (id(pa) == 0 && id(pick_started_ms) != 0 && millis() - id(pick_started_ms) < 15000 && !id(media_playing)) id(pa) = 51;
      - if:
          condition: {lambda: 'return id(pa) == 0;'}
          then:
            - homeassistant.action: {action: media_player.media_play_pause, data: {entity_id: "${player}"}}
      - if:
          condition: {lambda: 'return id(pa) == 50;'}
          then: [{script.execute: open_picker}]
      - if:
          condition: {lambda: 'return id(pa) == 51;'}
          then: [{script.execute: {id: toast, msg: "STARTING"}}]
      - if:
          condition: {lambda: 'return id(pa) == 5;'}
          then:
            - lambda: 'id(pick_open_ms) = 0;'
            - script.execute: pick_play

  - id: knob_next
    then:
      - script.execute: screen_timeout_timer
      - if:
          condition: {lambda: 'return id(current_mode) == 0;'}
          then:
            - homeassistant.action: {action: media_player.media_next_track, data: {entity_id: "${player}"}}
            - script.execute: {id: toast, msg: "NEXT"}

  - id: knob_prev
    then:
      - script.execute: screen_timeout_timer
      - if:
          condition: {lambda: 'return id(current_mode) == 0;'}
          then:
            - homeassistant.action: {action: media_player.media_previous_track, data: {entity_id: "${player}"}}
            - script.execute: {id: toast, msg: "PREVIOUS"}

  # hold: stop the music on every speaker in the house. Works from the night clock
  # too (a deliberate hold isn't a stray bump), never under the alarm popup.
  - id: knob_long
    then:
      - lambda: 'id(pa) = id(current_mode);'
      - script.execute: screen_timeout_timer
      - if:
          condition: {lambda: 'return id(pa) == 5;'}
          then: [{script.execute: switch_to_now}]
      - if:
          condition: {lambda: 'return id(pa) == 0 || (id(pa) == 9 && !id(alarm_popup_up));'}
          then:
            - homeassistant.action: {action: script.turn_on, data: {entity_id: script.rotary_stop_all}}
            - script.execute: {id: toast, msg: "ALL MUSIC STOPPED"}

  # held long enough without turning: say what letting go will do
  - id: hold_hint_start
    mode: restart
    then:
      - delay: 800ms
      - if:
          condition: {lambda: 'return id(rotary_button).state && !id(turned_while_held) && id(current_mode) == 0;'}
          then:
            - lambda: 'id(hold_hint) = true;'
            - script.execute: {id: toast, msg: "LET GO TO STOP ALL"}

  - id: hold_hint_end
    then:
      - script.stop: hold_hint_start
      - if:
          condition: {lambda: 'return id(hold_hint);'}
          then:
            - lambda: 'id(hold_hint) = false; id(toast_ms) = 0;'
            - script.execute: update_np

  # a short line in place of the artist, so a press is acknowledged at once
  - id: toast
    mode: restart
    parameters:
      msg: std::string
    then:
      - lambda: |-
          id(toast_ms) = millis() + (id(hold_hint) ? 60000 : 1600);
          lv_label_set_text((lv_obj_t *) id(noc_artist), msg.c_str());
      - delay: 1600ms
      - if:
          condition: {lambda: 'return !id(hold_hint);'}
          then:
            - lambda: 'id(toast_ms) = 0;'
            - script.execute: update_np

  # ══ NOW PLAYING ═══════════════════════════════════════════════════════════
  # Volume goes to HA as the player's new level plus the change since the last
  # send; script.rotary_volume moves every grouped room by that same change.
  - id: vol_send
    mode: restart
    then:
      - delay: 150ms
      - if:
          condition: {lambda: 'return ${group_vol};'}
          then:
            - homeassistant.action:
                action: script.rotary_volume
                data:
                  entity: ${player}
                  level: !lambda 'return id(vol_local);'
                  delta: !lambda 'return id(vol_local) - id(vol_sent);'
          else:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: ${player}
                  volume_level: !lambda 'return id(vol_local);'
      - lambda: 'id(vol_sent) = id(vol_local);'

  - id: seek_send
    mode: restart
    then:
      - delay: 400ms
      - homeassistant.action:
          action: media_player.media_seek
          data:
            entity_id: ${player}
            seek_position: !lambda 'return (int) id(pos_s);'

  # Pill's second line doubles as the readout while turning (1) or scrubbing (2)
  - id: hud_show
    mode: restart
    parameters:
      kind: int
    then:
      - lambda: 'id(hud_active) = true; id(hud_kind) = kind;'
      - script.execute: face_hud
      - delay: 1400ms
      - lambda: 'id(hud_active) = false;'
      - script.execute: face_hud_end
      - script.execute: update_np

  # Club on the TV input: borrow title + poster from whatever the TV is playing,
  # Plex client first (it has the real poster), then ABC iview (title only), then the Google TV Streamer.
  - id: tv_refresh
    then:
      - lambda: |-
          auto ok = [](const std::string &v) { return !(v.empty() || v == "unknown" || v == "unavailable" || v == "None"); };
          auto live = [](const std::string &s) { return s == "playing" || s == "paused"; };
          std::string title, sub, pic;
          if (live(id(tv_plex_state).state) && ok(id(tv_plex_title).state)) {
            title = id(tv_plex_title).state;
            sub = (id(tv_plex_type).state == "episode" && ok(id(tv_plex_series).state)) ? id(tv_plex_series).state : std::string("Plex");
          } else if (id(tv_atv_app).state == "au.net.abc.iview") {
            title = "ABC";              // iview doesn't say what it's playing
          } else if (ok(id(tv_cast_state).state) && ok(id(tv_cast_title).state)) {
            title = id(tv_cast_title).state;
            sub = ok(id(tv_cast_app).state) ? id(tv_cast_app).state : std::string("");
          }
          if (live(id(tv_plex_state).state) && ok(id(tv_plex_pic).state)) pic = id(tv_plex_pic).state;
          else if (live(id(tv_cast_state).state) && ok(id(tv_cast_pic).state)) pic = id(tv_cast_pic).state;
          else if (live(id(tv_atv_state).state) && ok(id(tv_atv_pic).state)) pic = id(tv_atv_pic).state;
          id(tv_title) = title; id(tv_sub) = sub; id(tv_pic) = pic;
      - if:
          condition:
            lambda: |-
              if (!id(media_is_tv) || id(tv_pic).empty()) return false;
              const std::string &x = id(tv_pic);
              size_t p = x.find("cache=");
              std::string k = "tv:" + (p == std::string::npos ? x : x.substr(p));
              if (k == id(art_key)) return false;
              id(art_key) = k;
              return true;
          then:
            - online_image.set_url:
                id: album_blur
                url: !lambda |-
                  const std::string &x = id(tv_pic);
                  return x[0] == '/' ? std::string("http://10.0.0.20:8123") + x : x;
      - script.execute: update_np

  - id: update_np
    then: [{script.execute: update_faces}]

  - id: update_faces
    then:
      - lambda: |-
          auto ok = [](const std::string &v) { return !(v.empty() || v == "unknown" || v == "unavailable" || v == "None"); };
          std::string t = ok(id(media_title).state) ? id(media_title).state : std::string("Nothing playing");
          std::string a = ok(id(media_artist).state) ? id(media_artist).state : std::string("");
          if (id(media_is_tv)) { t = id(tv_title).empty() ? std::string("TV") : id(tv_title); a = id(tv_sub); }
          size_t amp = a.find(" & "); if (amp != std::string::npos) a = a.substr(0, amp);
          if (!id(media_playing)) a = "Paused";
          for (auto &c : a) if ((unsigned char) c < 0x80) c = toupper((unsigned char) c);
          lv_label_set_text((lv_obj_t *) id(noc_title), t.c_str());
          if (millis() >= id(toast_ms)) lv_label_set_text((lv_obj_t *) id(noc_artist), a.c_str());
          lv_label_set_text((lv_obj_t *) id(noc_room), id(current_mode) == 5 ? "PLAY IN ${room_name}" : id(room_txt).c_str());
          lv_obj_set_style_opa((lv_obj_t *) id(noc_title), id(media_playing) ? LV_OPA_COVER : LV_OPA_50, LV_PART_MAIN);
          lv_obj_set_style_image_opa((lv_obj_t *) id(noc_bg), id(media_playing) ? 235 : 120, LV_PART_MAIN);
          // the progress hairline only makes sense for a track with a length
          if (id(dur_s) > 0 && !id(media_is_tv)) lv_obj_remove_flag((lv_obj_t *) id(noc_prog), LV_OBJ_FLAG_HIDDEN);
          else lv_obj_add_flag((lv_obj_t *) id(noc_prog), LV_OBJ_FLAG_HIDDEN);
          // night face: track info only while something is actually playing
          bool on = id(media_playing) && ok(t) && t != "Nothing playing";
          lv_label_set_text((lv_obj_t *) id(nt_title), on ? t.c_str() : "");
          lv_label_set_text((lv_obj_t *) id(nt_artist), on ? a.c_str() : "");


interval:
  # --- work alarm: pulse + clock + countdown twice a second while the popup is up
  - interval: 500ms
    then:
      - if:
          condition: {lambda: 'return id(alarm_popup_up);'}
          then:
            - script.execute: alarm_refresh_text
            - if:
                condition: {lambda: 'return id(alarm_state) == 1;'}
                then:
                  - lambda: 'id(alarm_pulse) = !id(alarm_pulse);'
                  - if:
                      condition: {lambda: 'return id(alarm_pulse);'}
                      then: [{lvgl.obj.update: {id: alarm_icon_bg, bg_opa: 70%}}]
                      else: [{lvgl.obj.update: {id: alarm_icon_bg, bg_opa: 25%}}]
  # --- work alarm: while RINGING, keep the screen on even if someone hits sleep
  - interval: 20s
    then:
      - if:
          condition: {lambda: 'return id(alarm_state) == 1;'}
          then:
            - lambda: 'id(night_active) = false;'
            - lvgl.widget.hide: grp_night
            - light.control: {id: display_backlight, brightness: 100%}
  # --- night clock tick + arm the idle timer once after boot
  - interval: 5s
    then:
      - if:
          condition: {lambda: 'return id(night_active);'}
          then: [{script.execute: update_night_clock}]
      - if:
          condition: {lambda: 'return !id(night_armed);'}
          then:
            - lambda: 'id(night_armed) = true;'
            - script.execute: screen_timeout_timer
            - script.execute: switch_to_now
  # --- track position (HA only reports it on changes) -> tonearm
  - interval: 1s
    then:
      - lambda: |-
          if (id(media_playing) && millis() - id(seek_touched_ms) > 1500) {
            id(pos_s) += 1;
            if (id(dur_s) > 0 && id(pos_s) > id(dur_s)) id(pos_s) = id(dur_s);
          }
          int pv = id(dur_s) > 0 ? (int) (id(pos_s) * 1000.0f / id(dur_s)) : 0;
          if (pv != lv_arc_get_value((lv_obj_t *) id(noc_prog))) lv_arc_set_value((lv_obj_t *) id(noc_prog), pv);
  # --- album art: retry a failed download
  - interval: 30s
    then:
      - if:
          condition: {lambda: 'return !id(art_ok) && !id(art_key).empty();'}
          then: [{component.update: album_blur}]
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - script.execute: update_clock

binary_sensor:
  # --- auto-stay (party mode): no night clock
  - platform: homeassistant
    id: party_mode
    entity_id: input_boolean.auto_stay
    on_press:
      then:
        - if:
            condition: {lambda: 'return id(night_active);'}
            then:
              - lvgl.widget.hide: grp_night
              - lambda: 'id(night_active) = false;'
              - script.execute: switch_to_now
        - script.execute: screen_timeout_timer
    on_release:
      then:
        - script.execute: screen_timeout_timer
  # --- work alarm (mirrors Home Assistant)
  - platform: homeassistant
    id: alarm_ringing
    entity_id: input_boolean.work_alarm_ringing
    on_state:
      then:
        - script.execute: update_alarm
  - platform: gpio
    id: rotary_button
    pin:
      pcf8574: pcf
      number: 5
      mode: INPUT
      inverted: true
    on_press:
      - lambda: 'id(turned_while_held) = false;'
      - script.execute: hold_hint_start
    on_release:
      - script.execute: hold_hint_end
    # press = play/pause · double = next · triple = previous · hold = stop everywhere
    on_multi_click:
      - timing:
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
          - OFF for at least 400ms
        then: [{script.execute: knob_prev}]
      - timing:
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
          - OFF for at least 400ms
        then: [{script.execute: knob_next}]
      - timing:
          - ON for 50ms to 500ms
          - OFF for at least 400ms
        then:
          - if:
              condition: {lambda: 'return !id(turned_while_held);'}
              then: [{script.execute: knob_press}]
      # fires on release, so hold + turn (scrub) never stops the music
      - timing:
          - ON for at least 800ms
          - OFF for at least 20ms
        then:
          - if:
              condition: {lambda: 'return !id(turned_while_held);'}
              then: [{script.execute: knob_long}]

sensor:
  - platform: rotary_encoder
    id: rotary_dial
    pin_a:
      number: 4
      mode: INPUT_PULLUP
    pin_b:
      number: 42
      mode: INPUT_PULLUP
    on_clockwise:
      - script.execute: {id: knob_turn, dir: 1}
    on_anticlockwise:
      - script.execute: {id: knob_turn, dir: -1}

  - platform: homeassistant
    id: ha_media_volume
    entity_id: ${player}
    attribute: volume_level
    on_value:
      then:
        - lambda: |-
            if (isnan(x)) return;
            if (millis() - id(vol_touched_ms) > 2500) { id(vol_local) = x; id(vol_sent) = x; }

  - platform: homeassistant
    id: ha_media_pos
    entity_id: ${player}
    attribute: media_position
    on_value:
      then:
        - lambda: 'if (!isnan(x) && millis() - id(seek_touched_ms) > 2500) id(pos_s) = x;'
  - platform: homeassistant
    id: ha_media_dur
    entity_id: ${player}
    attribute: media_duration
    on_value:
      then:
        - lambda: 'id(dur_s) = isnan(x) ? 0 : x;'
        - script.execute: update_np

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

touchscreen:
  - platform: cst816
    id: touch_screen
    # no reset line: after a soft restart the chip can still be asleep and
    # fail the chip-ID probe, so don't let the probe disable touch
    skip_probe: true
    on_touch:
      - lambda: 'id(tx0) = touch.x; id(tx1) = touch.x;'
      # the CST816 throws phantom touches at the (479,479) corner every minute or two;
      # anything outside the round glass must not wake the screen. Taps do nothing else.
      - if:
          condition:
            lambda: 'int dx = touch.x - 240, dy = touch.y - 240; return dx * dx + dy * dy < 236 * 236;'
          then:
            - lambda: 'id(user_wake) = true;'
            - script.execute: screen_timeout_timer
            - script.execute: pick_check
            - if:
                condition: {lambda: 'return id(current_mode) == 0 && !id(night_active) && id(pick_ok);'}
                then: [{script.execute: open_picker}]
    on_update:
      - lambda: 'for (auto &t : touches) { id(tx1) = t.x; break; }'
    # picker: swipe left / right to browse
    on_release:
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && abs(id(tx1) - id(tx0)) > 60;'}
          then:
            - lambda: 'id(swipe_ms) = millis();'
            - script.execute: {id: pick_move, dir: !lambda 'return id(tx1) < id(tx0) ? 1 : -1;'}
