
font:
  # --- alarm popup + night clock (unchanged)
  - file: "gfonts://Roboto@300"
    id: alarm_time
    size: 72
    bpp: 4
    glyphs: "0123456789:- "
  - file: "gfonts://Roboto@500"
    id: alarm_t24
    size: 24
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~·°–"
  - file: "gfonts://Roboto"
    id: alarm_t18
    size: 18
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~·°–"
  - file: "gfonts://Roboto@700"
    id: alarm_btn
    size: 20
    bpp: 4
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~·°–"
  # --- Bæo faces (Syne)
  # --- night face (Manrope; BaeoRemote Face A Spec.pdf)
  - file: "gfonts://Manrope@300"
    id: mr_num                 # night clock + volume numeral
    size: 104
    bpp: 4
    glyphs: "0123456789:-"
  - file: "gfonts://Manrope@700"
    id: mr_a14
    size: 14
    bpp: 4
    glyphs: @@CAPS@@
  - file: "gfonts://Manrope@400"
    id: mr_20                  # night title, default
    size: 20
    bpp: 4
    glyphs: @@LATIN@@
  - file: "gfonts://Syne@700"
    id: hk_22                  # BÆOSOUND wordmark: BÆO bold
    size: 22
    bpp: 4
    glyphs: "BÆO"
  - file: "gfonts://Syne@400"
    id: hk_22l                 # ...SOUND regular
    size: 22
    bpp: 4
    glyphs: "SOUND"
  - file: "gfonts://Syne@700"
    id: hk_16
    size: 18
    bpp: 4
    glyphs: @@CAPS@@
  - file: "gfonts://Syne@500"
    id: hk_clock
    size: 40
    bpp: 4
    glyphs: "0123456789:-"
  - file: "gfonts://Syne@400"
    id: hk_32
    size: 32
    bpp: 4
    glyphs: @@LATIN@@

text_sensor:
@@ALARM_TEXT_SENSORS@@
  - platform: homeassistant
    id: media_title
    entity_id: ${player}
    attribute: media_title
    on_value:
      then:
        - lambda: 'id(media_is_tv) = ${has_tv} && (x == std::string("TV") || x == std::string("TV Audio"));'
        - script.execute: tv_refresh
        # back from the TV: put the music artwork back
        - if:
            condition:
              lambda: |-
                if (id(media_is_tv) || id(art_key).rfind("tv:", 0) != 0) return false;
                const std::string &pic = id(media_picture).state;
                if (pic.empty() || pic[0] != '/') return false;
                size_t p = pic.find("cache=");
                id(art_key) = p == std::string::npos ? pic : pic.substr(p);
                return true;
            then:
              - online_image.set_url:
                  id: album_blur
                  url: !lambda 'return std::string("http://10.0.0.20:8123") + id(media_picture).state;'
        - if:
            condition: {lambda: 'return x != id(last_title);'}
            then:
              - lambda: 'id(last_title) = x;'
        - script.execute: update_np
        - script.execute: apply_awake_brightness
  - platform: homeassistant
    id: media_artist
    entity_id: ${player}
    attribute: media_artist
    on_value:
      then: [{script.execute: update_np}]
  - platform: homeassistant
    id: media_state
    entity_id: ${player}
    on_value:
      then:
        - lambda: 'id(media_playing) = (x == std::string("playing"));'
        - script.execute: update_np
        # play/pause changes the idle behaviour (dim vs night clock): restart the timer
        - script.execute: screen_timeout_timer
  # Album art: HA's proxy URL carries a rotating token plus a "cache=" hash of
  # the artwork; only refetch when that hash changes.
  - platform: homeassistant
    id: media_picture
    entity_id: ${player}
    attribute: entity_picture
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                if (id(media_is_tv) || x.empty() || x[0] != '/') return false;
                size_t p = x.find("cache=");
                std::string k = p == std::string::npos ? x : x.substr(p);
                if (k == id(art_key)) return false;
                id(art_key) = k;
                return true;
            then:
              - online_image.set_url:
                  id: album_blur
                  url: !lambda 'return std::string("http://10.0.0.20:8123") + x;'
  # --- the TV session (for when Club is on the TV input), as the Astrion TV card does
  - platform: homeassistant
    id: tv_plex_title
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: media_title
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_plex_series
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: media_series_title
    on_value:
      then: [{script.execute: tv_refresh}]
  # HA sends nothing when an attribute is missing, so a movie (no series title)
  # would keep the last show's name — gate the series on the content type.
  - platform: homeassistant
    id: tv_plex_type
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: media_content_type
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_plex_pic
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: entity_picture
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_plex_state
    entity_id: media_player.plex_plex_for_android_tv_tv
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_title
    entity_id: media_player.the_club_tv
    attribute: media_title
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_app
    entity_id: media_player.the_club_tv
    attribute: app_name
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_pic
    entity_id: media_player.the_club_tv
    attribute: entity_picture
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_state
    entity_id: media_player.the_club_tv
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_atv_pic
    entity_id: media_player.club_android_tv_10_0_0_248_club_tv
    attribute: entity_picture
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_atv_state
    entity_id: media_player.club_android_tv_10_0_0_248_club_tv
    on_value:
      then: [{script.execute: tv_refresh}]
  # which app the Streamer has in front (ABC iview shows as just "ABC")
  - platform: homeassistant
    id: tv_atv_app
    entity_id: media_player.club_android_tv_10_0_0_248_club_tv
    attribute: app_id
    on_value:
      then: [{script.execute: tv_refresh}]
  # rooms grouped with this player, for the line under the clock
  - platform: homeassistant
    id: room_group
    entity_id: ${player}
    attribute: group_members
    on_value:
      then:
        - lambda: |-
            static const char *const ent[] = {"media_player.club", "media_player.unnamed_room_5", "media_player.office_sonos",
                                              "media_player.bathroom_sonos", "media_player.bedroom_sonos"};
            static const char *const nm[] = {"CLUB", "LIVING ROOM", "OFFICE", "BATHROOM", "BEDROOM"};
            std::string others; int n = 0;
            for (int i = 0; i < 5; i++)
              if (std::string(ent[i]) != "${player}" && x.find(ent[i]) != std::string::npos) { n++; others = nm[i]; }
            std::string r = "${room_name}";
            if (n == 1) r += " + " + others;
            else if (n > 1) r += " + " + to_string(n) + " ROOMS";
            id(room_txt) = r;
        - script.execute: update_np

