text_sensor:
@@ALARM_TEXT_SENSORS@@
  - platform: homeassistant
    id: media_title
    entity_id: media_player.club
    attribute: media_title
    on_value:
      then:
        - lambda: 'id(media_is_tv) = (x == std::string("TV") || x == std::string("TV Audio"));'
        - script.execute: tv_refresh
        # back from the TV: put the music artwork back
        - if:
            condition:
              lambda: |-
                if (id(media_is_tv) || id(art_key).rfind("tv:", 0) != 0) return false;
                const std::string &pic = id(media_picture).state;
                if (pic.empty() || pic[0] != '/') return false;
                size_t p = pic.find("cache=");
                id(art_key) = p == std::string::npos ? pic : pic.substr(p);
                return true;
            then:
              - online_image.set_url:
                  id: album_blur
                  url: !lambda 'return std::string("http://10.0.0.20:8123") + id(media_picture).state;'
        - if:
            condition: {lambda: 'return x != id(last_title);'}
            then:
              - lambda: 'id(last_title) = x;'
        - script.execute: update_np
        - script.execute: apply_awake_brightness
  - platform: homeassistant
    id: media_artist
    entity_id: media_player.club
    attribute: media_artist
    on_value:
      then: [{script.execute: update_np}]
  - platform: homeassistant
    id: media_state
    entity_id: media_player.club
    on_value:
      then:
        - lambda: 'id(media_playing) = (x == std::string("playing"));'
        - script.execute: update_np
  # Album art: HA's proxy URL carries a rotating token plus a "cache=" hash of
  # the artwork; only refetch when that hash changes.
  - platform: homeassistant
    id: media_picture
    entity_id: media_player.club
    attribute: entity_picture
    on_value:
      then:
        - if:
            condition:
              lambda: |-
                if (id(media_is_tv) || x.empty() || x[0] != '/') return false;
                size_t p = x.find("cache=");
                std::string k = p == std::string::npos ? x : x.substr(p);
                if (k == id(art_key)) return false;
                id(art_key) = k;
                return true;
            then:
              - online_image.set_url:
                  id: album_blur
                  url: !lambda 'return std::string("http://10.0.0.20:8123") + x;'
  # --- the TV session (for when Club is on the TV input), as the Astrion TV card does
  - platform: homeassistant
    id: tv_plex_title
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: media_title
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_plex_series
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: media_series_title
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_plex_pic
    entity_id: media_player.plex_plex_for_android_tv_tv
    attribute: entity_picture
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_plex_state
    entity_id: media_player.plex_plex_for_android_tv_tv
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_title
    entity_id: media_player.the_club_tv
    attribute: media_title
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_app
    entity_id: media_player.the_club_tv
    attribute: app_name
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_pic
    entity_id: media_player.the_club_tv
    attribute: entity_picture
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_cast_state
    entity_id: media_player.the_club_tv
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_atv_pic
    entity_id: media_player.club_android_tv_10_0_0_248_club_tv
    attribute: entity_picture
    on_value:
      then: [{script.execute: tv_refresh}]
  - platform: homeassistant
    id: tv_atv_state
    entity_id: media_player.club_android_tv_10_0_0_248_club_tv
    on_value:
      then: [{script.execute: tv_refresh}]
  # Playlists page lists, flattened by the HA package rotary_lists.yaml
  - platform: homeassistant
    id: rl_favs
    entity_id: sensor.rotary_lists
    attribute: fav_names
    on_value:
      then:
        - lambda: |-
            id(fav_v) = [&] { std::vector<std::string> v; if (x.empty()) return v; size_t s = 0; for (;;) { size_t p = x.find('|', s); v.push_back(x.substr(s, p == std::string::npos ? std::string::npos : p - s)); if (p == std::string::npos) return v; s = p + 1; } }();
        - if:
            condition: {lambda: 'return id(current_mode) == 6;'}
            then: [{script.execute: pl_render}]
  - platform: homeassistant
    id: rl_albums
    entity_id: sensor.rotary_lists
    attribute: album_names
    on_value:
      then:
        - lambda: |-
            id(alb_v) = [&] { std::vector<std::string> v; if (x.empty()) return v; size_t s = 0; for (;;) { size_t p = x.find('|', s); v.push_back(x.substr(s, p == std::string::npos ? std::string::npos : p - s)); if (p == std::string::npos) return v; s = p + 1; } }();
        - if:
            condition: {lambda: 'return id(current_mode) == 6;'}
            then: [{script.execute: pl_render}]
  - platform: homeassistant
    id: rl_artists
    entity_id: sensor.rotary_lists
    attribute: album_artists
    on_value:
      then:
        - lambda: |-
            id(art_v) = [&] { std::vector<std::string> v; if (x.empty()) return v; size_t s = 0; for (;;) { size_t p = x.find('|', s); v.push_back(x.substr(s, p == std::string::npos ? std::string::npos : p - s)); if (p == std::string::npos) return v; s = p + 1; } }();
  - platform: homeassistant
    id: club_group
    entity_id: media_player.club
    attribute: group_members
    on_value:
      then:
        - lambda: |-
            static const char *const e[] = @@ROOM_ENTS_ARR@@;
            int m = 1;
            for (int i = 1; i < 5; i++) if (x.find(e[i]) != std::string::npos) m |= 1 << i;
            id(sp_mask) = m;

lvgl:
@@TOP_LAYER@@
  displays:
    - my_display
  touchscreens:
    - touch_screen
  bg_color: 0x000000
  text_color: 0xEEF1F7
  default_font: mr_20
  theme:
    button:
      shadow_width: 0
    label:
      text_font: mr_20

  pages:
    - id: main_page
      scrollable: false
      pad_all: 0
      border_width: 0
      bg_color: 0x000000
      scrollbar_mode: "OFF"
      widgets:
@@FACES@@
        # ── PLAYLISTS page
        - obj:
            id: grp_pl
            scrollable: false
            hidden: true
            align: CENTER
            width: 480
            height: 480
            radius: 0
            bg_color: 0x2A2B2F
            bg_grad_color: 0x0B0B0D
            bg_grad_dir: VER
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
