text_sensor:
  # --- work alarm (mirrors Home Assistant)
  - platform: homeassistant
    id: alarm_snooze_state
    entity_id: timer.work_alarm_snooze
    on_value:
      then:
        - script.execute: update_alarm
  - platform: homeassistant
    id: alarm_snooze_finish
    entity_id: timer.work_alarm_snooze
    attribute: finishes_at
  - platform: homeassistant
    id: alarm_work_start
    entity_id: sensor.work_start
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(alarm_popup_up);'}
            then: [{script.execute: alarm_refresh_text}]
  - platform: homeassistant
    id: alarm_work_summary
    entity_id: sensor.work_start
    attribute: summary
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(alarm_popup_up);'}
            then: [{script.execute: alarm_refresh_text}]
  - platform: homeassistant
    id: alarm_work_location
    entity_id: sensor.work_start
    attribute: location
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(alarm_popup_up);'}
            then: [{script.execute: alarm_refresh_text}]
  - platform: homeassistant
    id: media_title
    entity_id: media_player.club
    attribute: media_title
    on_value:
      then:
        - lvgl.label.update:
            id: title_label
            text: !lambda "return x;"
        # "TV" title -> stop the record spinning, hold the screen at 50%,
        # and hide the title/artist labels (no useful metadata for TV).
        - lambda: 'id(media_is_tv) = (x == std::string("TV"));'
        - if:
            condition: {lambda: 'return id(media_is_tv);'}
            then:
              - lvgl.widget.hide: title_label
              - lvgl.widget.hide: artist_label
            else:
              - if:
                  condition: {lambda: 'return id(current_mode) == 0;'}
                  then:
                    - lvgl.widget.show: title_label
                    - lvgl.widget.show: artist_label
        # Keep the Home page's now-playing caption in step
        - script.execute: update_home_media
        - script.execute: apply_awake_brightness
  - platform: homeassistant
    id: media_artist
    entity_id: media_player.club
    attribute: media_artist
    on_value:
      then:
        - lvgl.label.update:
            id: artist_label
            text: !lambda "return x;"
        - script.execute: update_home_media

  # Track play/pause state so the record only spins while music is playing
  - platform: homeassistant
    id: media_state
    entity_id: media_player.club
    on_value:
      then:
        - lambda: 'id(media_playing) = (x == std::string("playing"));'
        # Start/stop the Home page record sheen with playback
        - script.execute: update_home_media

  - platform: homeassistant
    id: ha_climate_state
    entity_id: climate.aircon
    on_value:
      then:
        - lvgl.label.update:
            id: climate_state_lbl
            text: !lambda "return x;"
        - if:
            condition: {lambda: 'return id(current_mode) == 2;'}
            then: [{script.execute: update_climate_wheel}]

  # CLIMATE fan mode — lights the matching fan wedge on the Climate wheel
  - platform: homeassistant
    id: ha_climate_fan
    entity_id: climate.aircon
    attribute: fan_mode
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(current_mode) == 2;'}
            then: [{script.execute: update_climate_wheel}]

  # BLINDS state — big OPEN / CLOSED / OPENING readout on the Blind control page
  - platform: homeassistant
    id: ha_blinds_state
    entity_id: cover.blinds
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && (id(blind_sel) == 1 || id(blind_sel) == 3);'}
            then: [{script.execute: update_blind_state_lbl}]

  - platform: homeassistant
    id: ha_bed_blinds_state
    entity_id: cover.smart_blinds_curtain
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 0;'}
            then: [{script.execute: update_blind_state_lbl}]

  - platform: homeassistant
    id: ha_sheer_blinds_state
    entity_id: cover.club_sheer_blinds
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 2;'}
            then: [{script.execute: update_blind_state_lbl}]

# --------------------------------------------------------
# LVGL — SINGLE PAGE
# -----------------
lvgl:
  # Night clock lives on LVGL's top layer so it is always above every page.
  top_layer:
    widgets:
      - obj:
          id: grp_alarm
          hidden: true
          align: center
          width: 480
          height: 480
          bg_color: 0x000000
          bg_opa: 92%
          border_width: 0
          radius: 0
          pad_all: 0
          scrollbar_mode: "OFF"
          widgets:
            # panel (inset 14 px from the rim). The scrim itself swallows every tap.
            - obj:
                align: center
                width: 452
                height: 452
                radius: 226
                bg_color: 0x10151C
                border_width: 2
                border_color: 0x27313D
                pad_all: 0
                clickable: false
                scrollbar_mode: "OFF"
            - obj:
                id: alarm_icon_bg
                align: center
                y: -180
                width: 60
                height: 60
                radius: 30
                bg_color: 0xF59E0B
                bg_opa: 40%
                border_width: 0
                pad_all: 0
                clickable: false
                scrollbar_mode: "OFF"
            - label:
                id: alarm_icon_lbl
                text: "\uF0F3"
                align: center
                y: -180
                text_font: montserrat_28
                text_color: 0xF59E0B
            - label:
                id: alarm_caps_lbl
                text: "ALARM"
                align: center
                y: -136
                text_font: alarm_btn
                text_letter_space: 4
                text_color: 0xF59E0B
            - label:
                id: alarm_time_lbl
                text: "--:--"
                align: center
                y: -78
                text_font: alarm_time
                text_color: 0xF1F5F9
            - label:
                id: alarm_ampm_lbl
                text: ""
                align: center
                y: -24
                text_font: alarm_t18
                text_color: 0x94A3B8
            - label:
                id: alarm_what_lbl
                text: ""
                align: center
                y: 8
                width: 360
                long_mode: DOT
                text_align: center
                text_font: alarm_t24
                text_color: 0xE2E8F0
            - label:
                id: alarm_start_lbl
                text: ""
                align: center
                y: 37
                text_font: alarm_t18
                text_color: 0x94A3B8
            - label:
                id: alarm_back_lbl
                text: ""
                hidden: true
                align: center
                y: 64
                text_font: alarm_t24
                text_color: 0x60A5FA
            # RINGING: one big tap
            - button:
                id: btn_alarm_snooze
                align: center
                y: 96
                width: 300
                height: 60
                radius: 30
                bg_color: 0xF59E0B
                shadow_width: 0
                border_width: 0
                pad_all: 0
                on_click:
                  - homeassistant.action: {action: script.turn_on, data: {entity_id: script.work_alarm_snooze}}
                widgets:
                  - label: {text: "Snooze 5 min", align: center, text_font: alarm_btn, text_color: 0x1A1205}
            # SNOOZED: quiet text button, hides the popup on this screen only
            - button:
                id: btn_alarm_hide
                hidden: true
                align: center
                y: 100
                width: 280
                height: 48
                radius: 24
                bg_opa: 0
                shadow_width: 0
                border_width: 0
                pad_all: 0
                on_click:
                  - lambda: 'id(alarm_view_hidden) = true;'
                  - script.execute: update_alarm
                widgets:
                  - label: {text: "Hide until it rings again", align: center, text_font: alarm_t18, text_color: 0x8FA3BF}
            # ALWAYS: hold to dismiss
            - button:
                id: btn_alarm_dismiss
                align: center
                y: 172
                width: 250
                height: 60
                radius: 30
                bg_color: 0x3A1616
                border_width: 2
                border_color: 0x7F2A2A
                shadow_width: 0
                pad_all: 0
                on_press:
                  - script.execute: alarm_hold
                on_release:
                  - script.stop: alarm_hold
                  - lvgl.bar.update: {id: alarm_hold_bar, value: 0, animated: true}
                on_press_lost:
                  - script.stop: alarm_hold
                  - lvgl.bar.update: {id: alarm_hold_bar, value: 0, animated: true}
                widgets:
                  - bar:
                      id: alarm_hold_bar
                      align: center
                      width: 244
                      height: 54
                      min_value: 0
                      max_value: 100
                      value: 0
                      clickable: false
                      radius: 27
                      bg_opa: 0
                      indicator:
                        bg_color: 0xB91C1C
                        bg_opa: 85%
                        radius: 27
                  - label:
                      text: "Hold to dismiss for today"
                      align: center
                      width: 200
                      text_align: center
                      text_font: alarm_btn
                      text_color: 0xFCA5A5
      - obj:
          id: grp_night
          hidden: true
          align: center
          width: 480
          height: 480
          bg_color: 0x000000
          bg_opa: COVER
          border_width: 0
          radius: 0
          pad_all: 0
          scrollbar_mode: "OFF"
          widgets:
            - label:
                id: night_clock_lbl
                text: "--:--"
                align: center
                y: -26
                text_font: roboto_night
                text_color: ${night_clock_color}
            - label:
                id: night_date_lbl
                text: ""
                align: center
                y: 76
                text_font: roboto_24
                text_color: ${night_date_color}
  displays:
    - my_display
  touchscreens:
    - touch_screen
  bg_color: 0x000000
  text_color: 0xE2E8F0
  default_font: roboto_18
  theme:
    button:
      bg_color: 0x334155
      radius: 16
      shadow_width: 8
      shadow_ofs_y: 3
      shadow_opa: 35%
      shadow_color: 0x000000
    label:
      text_font: roboto_18
      text_color: 0xE2E8F0

  pages:
    - id: main_page
      pad_all: 0
      border_width: 0
      bg_color: 0x000000
      scrollbar_mode: "OFF"
      widgets:

        # ── MAIN VALUE ARC (outermost ring: brightness / temp / volume / blind pos)
        - arc:
            id: main_arc
            align: center
            width: 470
            height: 470
            min_value: 0
            max_value: 100
            value: 0
            bg_opa: 0
            arc_color: 0x0E1414
            arc_width: 15
            indicator:
              arc_color: 0x34E3D1
              arc_width: 15
            on_value:
              then:
                - if:
                    condition: {lambda: 'return id(current_mode) == 0;'}
                    then:
                      - homeassistant.action:
                          action: media_player.volume_set
                          data: {entity_id: media_player.club}
                          data_template: {volume_level: "{{ vol }}"}
                          variables: {vol: !lambda 'return x / 100.0f;'}
                - if:
                    condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 2;'}
                    then:
                      - lambda: |-
                          if (id(selected_light_idx) == 0) id(lights_bright_art) = x;
                          else if (id(selected_light_idx) == 1) id(lights_bright_down) = x;
                          else if (id(selected_light_idx) == 2) id(lights_bright_leds) = x;
                          else if (id(selected_light_idx) == 3) id(lights_bright_accent) = x;
                          else if (id(selected_light_idx) == 4) id(lights_bright_kitchen) = x;
                          else if (id(selected_light_idx) == 5) id(lights_bright_bar) = x;
                          else if (id(selected_light_idx) == 6) id(lights_bright_candles) = x;
                      - script.execute: update_light_ui
                      - script.execute: call_light_turn_on
                - if:
                    condition: {lambda: 'return id(current_mode) == 2;'}
                    then:
                      - lambda: 'id(target_temp_val) = roundf((x * 14.0f / 100.0f) + 16.0f);'
                      - lvgl.label.update:
                          id: target_temp_lbl
                          text: !lambda |-
                            char buf[16];
                            snprintf(buf, sizeof(buf), "%.0f°C", id(target_temp_val));
                            return buf;
                      - script.execute:
                          id: update_climate_temp
                          new_temp: !lambda 'return id(target_temp_val);'

        # ── HOME WHEEL (level 0) ─────────────────────────────────────────────
        # Wedge size reflects prominence: Lights largest, Scenes smallest.
        - obj:
            id: grp_home
            align: center
            width: 480
            height: 480
            bg_opa: 0
            border_width: 0
            pad_all: 0
            clickable: false
            scrollbar_mode: "OFF"
            widgets:
              - arc: {id: home_arc0, align: center, width: 430, height: 430, start_angle: 1,   end_angle: 83,  min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x8A6714, arc_width: 100, indicator: {arc_width: 0}}
              - arc: {id: home_arc1, align: center, width: 430, height: 430, start_angle: 85,  end_angle: 145, min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x1C1226, arc_width: 100, indicator: {arc_width: 0}}
              - arc: {id: home_arc2, align: center, width: 430, height: 430, start_angle: 147, end_angle: 219, min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x0A211F, arc_width: 100, indicator: {arc_width: 0}}
              - arc: {id: home_arc3, align: center, width: 430, height: 430, start_angle: 221, end_angle: 293, min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x0D1E2C, arc_width: 100, indicator: {arc_width: 0}}
              - arc: {id: home_arc4, align: center, width: 430, height: 430, start_angle: 295, end_angle: 359, min_value: 0, max_value: 100, value: 0, adjustable: false, clickable: false, arc_rounded: false, bg_opa: 0, arc_color: 0x131E29, arc_width: 100, indicator: {arc_width: 0}}
              # ── GHOST RECORD (shown only while the MEDIA wedge is picked) ─
              # Sits above the wedges but below the icons/clock: a dark veil
              # dims the wheel just enough for the grooves to read, and the
              # icons + centre text stay full brightness on top of it.
              # No wordmark here — the clock lives in the label area.
              - obj:
                  id: grp_home_vinyl
                  hidden: true
                  align: center
                  width: 430
                  height: 430
                  radius: 215
                  bg_color: 0x000000
                  bg_opa: 45%
                  border_width: 0
                  pad_all: 0
                  clickable: false
                  scrollbar_mode: "OFF"
                  widgets:
                    # Grooves: faint light rings over the dimmed wheel
                    - obj: {align: center, width: 418, height: 418, radius: 209, bg_opa: 0, border_width: 1, border_color: 0xCBD5E1, border_opa: 14%, pad_all: 0}
                    - obj: {align: center, width: 390, height: 390, radius: 195, bg_opa: 0, border_width: 1, border_color: 0xCBD5E1, border_opa: 11%, pad_all: 0}
                    - obj: {align: center, width: 362, height: 362, radius: 181, bg_opa: 0, border_width: 1, border_color: 0xCBD5E1, border_opa: 11%, pad_all: 0}
                    - obj: {align: center, width: 334, height: 334, radius: 167, bg_opa: 0, border_width: 1, border_color: 0xCBD5E1, border_opa: 11%, pad_all: 0}
                    - obj: {align: center, width: 306, height: 306, radius: 153, bg_opa: 0, border_width: 1, border_color: 0xCBD5E1, border_opa: 11%, pad_all: 0}
                    - obj: {align: center, width: 278, height: 278, radius: 139, bg_opa: 0, border_width: 1, border_color: 0xCBD5E1, border_opa: 11%, pad_all: 0}
                    - obj: {align: center, width: 250, height: 250, radius: 125, bg_opa: 0, border_width: 1, border_color: 0xCBD5E1, border_opa: 11%, pad_all: 0}
                    - obj: {align: center, width: 222, height: 222, radius: 111, bg_opa: 0, border_width: 1, border_color: 0xCBD5E1, border_opa: 14%, pad_all: 0}
                    # Two highlights sweeping the grooves at one shared speed:
                    # the "it's spinning" tell. Hidden while paused.
                    - spinner:
                        id: hv_sheen_outer
                        hidden: true
                        align: center
                        width: 348
                        height: 348
                        clickable: false
                        spin_time: 3s
                        arc_length: 55
                        arc_width: 3
                        arc_opa: 0%
                        indicator:
                          arc_color: 0xE2E8F0
                          arc_width: 3
                          arc_opa: 30%
                    - spinner:
                        id: hv_sheen_inner
                        hidden: true
                        align: center
                        width: 264
                        height: 264
                        clickable: false
                        spin_time: 3s
                        arc_length: 30
                        arc_width: 2
                        arc_opa: 0%
                        indicator:
                          arc_color: 0x34E3D1
                          arc_width: 2
                          arc_opa: 28%
