number:
  - platform: template
    id: night_brightness
    name: "Night Brightness"
    icon: "mdi:brightness-6"
    entity_category: config
    mode: slider
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 15
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    on_value:
      then:
        - if:
            condition: {lambda: 'return id(night_active);'}
            then:
              - light.control:
                  id: display_backlight
                  brightness: !lambda 'return x / 100.0f;'