substitutions:
  night_idle: 180s              # no interaction for this long -> faded clock
  night_clock_color: "0x9A5F2C" # warm amber: no blue light while sleeping
  night_date_color: "0x6E4526"

esphome:
  name: rotary-display-1
  friendly_name: rotary-display-1
  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 800
    then:
      - output.turn_on: lcd_power
      - output.turn_on: display_reset
      - delay: 100ms
      - output.turn_off: display_reset
      - delay: 500ms

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    
psram:
  mode: octal
  speed: 80MHz 

logger:

api:
  actions:
    # Test hook only: preview the alarm popup without touching Home Assistant.
    # mode 1 = ringing, 2 = snoozed, 0 = back to live. Reverts by itself after 25 s.
    - action: alarm_preview
      variables:
        mode: int
      then:
        - lambda: 'id(alarm_preview) = mode;'
        - script.execute: update_alarm
        - script.execute: alarm_preview_timeout
  encryption:
    key: !secret rotary_api_key

ota:
  - platform: esphome
    password: !secret rotary_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Rotary-Display-1"
    password: !secret rotary_ap_password

  use_address: 10.0.1.122
captive_portal:

web_server:
  port: 80

# --------------------------------------------------------


# HARDWARE & I2C
# --------------------------------------------------------
i2c:
  sda: GPIO38
  scl: GPIO39
  id: bus_a
  scan: true
  frequency: 400kHz

pcf8574:
  - id: pcf
    address: 0x21

output:
  - platform: ledc
    pin: 6
    id: bl_pwm
    frequency: 19531Hz

  - platform: gpio
    id: lcd_power
    pin:
      pcf8574: pcf
      number: 3
      mode: output

  - platform: gpio
    id: display_reset
    pin:
      pcf8574: pcf
      number: 4
      mode: output
      inverted: true

light:
  - platform: monochromatic
    name: "LCD Backlight"
    output: bl_pwm
    id: display_backlight
    default_transition_length: 0.5s
    restore_mode: ALWAYS_ON
    # Never let the screen go fully dark: if anything (HA, web UI) turns it
    # off, bounce it straight back on at the dim level.
    on_turn_off:
      - delay: 50ms
      - light.turn_on:
          id: display_backlight
          brightness: 55%

# --------------------------------------------------------
# IMAGE ASSETS
# --------------------------------------------------------
image:
  - file: "sonos_white.png"    # trimmed white wordmark (spins on the record label)
    id: sonos_logo
    type: RGB565
    transparency: alpha_channel
    resize: 120x24

  # --- PLAYLIST ICONS ------------------------------------------------------
  # White-on-transparent versions were generated for the four black icons;
  # the turntable is kept in full colour.
  - file: "icon_disco_w.png"    # disco ball -> Disco
    id: icon_disco
    type: RGB565
    transparency: alpha_channel
    resize: 38x44
  - file: "icon_house_w.png"    # house -> House
    id: icon_house
    type: RGB565
    transparency: alpha_channel
    resize: 50x40
  - file: "icon_mos_w.png"      # Ministry of Sound -> MOS
    id: icon_mos
    type: RGB565
    transparency: alpha_channel
    resize: 46x42
  - file: "icon_pdm.png"        # turntable (colour) -> PDM
    id: icon_pdm
    type: RGB565
    transparency: alpha_channel
    resize: 48x48
  - file: "icon_dfp_w.png"      # Paris sign -> DFP
    id: icon_dfp
    type: RGB565
    transparency: alpha_channel
    resize: 44x44

  # --- HOME PAGE ICONS (muted neon, one per page) --------------------------
  - file: "ico_lights.png"
    id: ico_lights
    type: RGB565
    transparency: alpha_channel
  - file: "ico_scenes.png"
    id: ico_scenes
    type: RGB565
    transparency: alpha_channel
  - file: "ico_media.png"
    id: ico_media
    type: RGB565
    transparency: alpha_channel
  - file: "ico_climate.png"
    id: ico_climate
    type: RGB565
    transparency: alpha_channel
  - file: "ico_blinds.png"
    id: ico_blinds
    type: RGB565
    transparency: alpha_channel

# --------------------------------------------------------
# GLOBALS
# current_mode: 0=Media 1=Lights 2=Climate 3=Home 4=Scenes 5=Blinds
# home_menu_idx: 0=Lights 1=Scenes 2=Media 3=Climate 4=Blinds
# selected_light_idx: 0=Art 1=Downs 2=LEDs 3=Accent 4=Kitchen 5=Bar 6=Candles
# --------------------------------------------------------
globals:
  - id: alarm_state             # 0 hidden · 1 ringing · 2 snoozed (derived from HA)
    type: int
    initial_value: '0'
  - id: alarm_popup_up          # popup currently on screen
    type: bool
    initial_value: 'false'
  - id: alarm_view_hidden       # "Hide until it rings again" (this screen only)
    type: bool
    initial_value: 'false'
  - id: alarm_pulse
    type: bool
    initial_value: 'false'
  - id: alarm_preview           # 0 = live from HA; 1/2 = preview (test hook only)
    type: int
    initial_value: '0'
  - id: alarm_time_txt
    type: std::string
    initial_value: '"--:--"'
  - id: alarm_ampm_txt
    type: std::string
    initial_value: '""'
  - id: alarm_what_txt
    type: std::string
    initial_value: '""'
  - id: alarm_start_txt
    type: std::string
    initial_value: '""'
  - id: alarm_back_txt
    type: std::string
    initial_value: '""'
  - id: night_active          # true while the faded clock is showing
    type: bool
    initial_value: 'false'
  - id: night_armed           # idle countdown armed once after boot
    type: bool
    initial_value: 'false'
  - id: current_mode
    type: int
    initial_value: '3'
  - id: selected_light_idx
    type: int
    initial_value: '0'
  - id: lights_bright_val
    type: float
    initial_value: '0'
  - id: lights_bright_art
    type: float
    initial_value: '0'
  - id: lights_bright_down
    type: float
    initial_value: '0'
  - id: lights_bright_leds
    type: float
    initial_value: '0'
  - id: lights_bright_accent
    type: float
    initial_value: '0'
  - id: lights_bright_kitchen
    type: float
    initial_value: '0'
  - id: lights_bright_bar
    type: float
    initial_value: '0'
  - id: lights_bright_candles
    type: float
    initial_value: '0'
  - id: target_temp_val
    type: float
    initial_value: '24.0'
  # --- VINYL SPIN ---
  - id: vinyl_angle          # current record rotation, in 0.1° units (0–3600)
    type: int
    initial_value: '0'
  - id: media_playing        # true while media_player.club is "playing"
    type: bool
    initial_value: 'false'
  - id: media_is_tv          # true while the media title is "TV"
    type: bool
    initial_value: 'false'
  - id: home_menu_idx        # 0=Lights 1=Scenes 2=Media 3=Climate 4=Blinds
    type: int
    initial_value: '0'
  - id: selected_scene       # 0=White 1=Bae 2=Night 3=Day 4=Club 5=Off
    type: int
    initial_value: '0'
  - id: nav_level            # 0=Home wheel  1=section wheel  2=control page
    type: int
    initial_value: '0'
  - id: blind_sel            # 0=Bedroom  1=Club  2=Club Sheer  3=All
    type: int
    initial_value: '0'
  - id: pa_mode              # scratch: state captured at the start of an action
    type: int
    initial_value: '0'

# --------------------------------------------------------
# SCRIPTS
# --------------------------------------------------------
script:
  # ══ WORK ALARM POPUP ═══════════════════════════════════════════════════════
  # Recompute from HA every time either entity changes; never track our own state.
  #   ringing off                  -> HIDDEN
  #   ringing on, timer not active -> RINGING
  #   ringing on, timer active     -> SNOOZED
  - id: update_alarm
    mode: restart
    then:
      - lambda: |-
          bool ring = id(alarm_ringing).state;
          bool snz = ring && id(alarm_snooze_state).state == "active";
          int st = !ring ? 0 : (snz ? 2 : 1);
          if (id(alarm_preview) == 1) st = 1;        // test hook
          else if (id(alarm_preview) == 2) st = 2;
          if (st != 2) id(alarm_view_hidden) = false;  // rings again -> show again
          id(alarm_state) = st;
      - if:
          condition: {lambda: 'return id(alarm_state) == 1 || (id(alarm_state) == 2 && !id(alarm_view_hidden));'}
          then:
            - script.execute: alarm_show
          else:
            - script.execute: alarm_hide

  - id: alarm_show
    then:
      - lambda: |-
          id(alarm_popup_up) = true;
          id(current_mode) = 9;     // inert: knob/button can't act on the page underneath
          id(nav_level) = 0;
      - if:
          condition: {lambda: 'return id(alarm_state) == 1;'}
          then:
            # RINGING: wake the screen, even from the night clock
            - lambda: 'id(night_active) = false;'
            - lvgl.widget.hide: grp_night
            - light.control: {id: display_backlight, brightness: 100%}
      - script.execute: alarm_render
      - lvgl.widget.show: grp_alarm
      # Restart the idle countdown (relevant once snoozed: the screen may time out)
      - if:
          condition: {lambda: 'return id(alarm_state) == 2 && !id(night_active);'}
          then: [{script.execute: screen_timeout_timer}]

  - id: alarm_hide
    then:
      - if:
          condition: {lambda: 'return id(alarm_popup_up);'}
          then:
            - lambda: 'id(alarm_popup_up) = false;'
            - lvgl.widget.hide: grp_alarm
            - script.stop: alarm_hold
            - lvgl.bar.update: {id: alarm_hold_bar, value: 0}
            - if:
                condition: {lambda: 'return !id(night_active);'}
                then:
                  - script.execute: switch_to_home
                  - script.execute: screen_timeout_timer

  - id: alarm_render
    then:
      - if:
          condition: {lambda: 'return id(alarm_state) == 1;'}
          then:
            - lvgl.obj.update: {id: alarm_icon_bg, bg_color: 0xF59E0B, bg_opa: 40%}
            - lvgl.label.update: {id: alarm_icon_lbl, text_color: 0xF59E0B}
            - lvgl.label.update: {id: alarm_caps_lbl, text: "ALARM", text_color: 0xF59E0B}
            - lvgl.widget.show: btn_alarm_snooze
            - lvgl.widget.hide: btn_alarm_hide
            - lvgl.widget.hide: alarm_back_lbl
          else:
            - lvgl.obj.update: {id: alarm_icon_bg, bg_color: 0x3B82F6, bg_opa: 30%}
            - lvgl.label.update: {id: alarm_icon_lbl, text_color: 0x60A5FA}
            - lvgl.label.update: {id: alarm_caps_lbl, text: "SNOOZED", text_color: 0x60A5FA}
            - lvgl.widget.hide: btn_alarm_snooze
            - lvgl.widget.show: btn_alarm_hide
            - lvgl.widget.show: alarm_back_lbl
      - script.execute: alarm_refresh_text

  # Clock, "what it's for", "Starts at", and the snooze countdown.
  - id: alarm_refresh_text
    then:
      - lambda: |-
          // ISO-8601 (with offset, or Z) -> epoch seconds
          auto parse_iso = [](const std::string &s, time_t &out) -> bool {
            int Y = 0, M = 0, D = 0, h = 0, m = 0, sec = 0;
            if (sscanf(s.c_str(), "%d-%d-%d%*c%d:%d:%d", &Y, &M, &D, &h, &m, &sec) != 6) return false;
            int off = 0;
            size_t p = s.find_first_of("+-Zz", 19);
            if (p != std::string::npos && s[p] != 'Z' && s[p] != 'z') {
              int oh = 0, om = 0;
              sscanf(s.c_str() + p + 1, "%d:%d", &oh, &om);
              off = (oh * 3600 + om * 60) * (s[p] == '-' ? -1 : 1);
            }
            int y = Y - (M <= 2 ? 1 : 0);
            int era = (y >= 0 ? y : y - 399) / 400;
            int yoe = y - era * 400;
            int doy = (153 * (M + (M > 2 ? -3 : 9)) + 2) / 5 + D - 1;
            int doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
            long days = (long) era * 146097L + doe - 719468L;
            out = (time_t) (days * 86400L + h * 3600L + m * 60L + sec - off);
            return true;
          };
          auto ok = [](const std::string &v) {
            return !(v.empty() || v == "unknown" || v == "unavailable" || v == "None");
          };
          auto now = id(ha_time).now();

          // current time, 12-hour
          if (now.is_valid()) {
            int h12 = now.hour % 12; if (h12 == 0) h12 = 12;
            char b[12]; snprintf(b, sizeof(b), "%d:%02d", h12, now.minute);
            id(alarm_time_txt) = b;
            id(alarm_ampm_txt) = now.hour >= 12 ? "PM" : "AM";
          } else { id(alarm_time_txt) = "--:--"; id(alarm_ampm_txt) = ""; }

          // what it's for: summary · location
          std::string w = ok(id(alarm_work_summary).state) ? id(alarm_work_summary).state : "";
          if (ok(id(alarm_work_location).state))
            w += w.empty() ? id(alarm_work_location).state : " · " + id(alarm_work_location).state;
          if (w.empty() && id(alarm_preview) != 0) w = "Preview alarm · RSC";
          id(alarm_what_txt) = w;

          // Starts at (start time is UTC; show local)
          time_t t;
          if (parse_iso(id(alarm_work_start).state, t)) {
            auto lt = ESPTime::from_epoch_local(t);
            int h12 = lt.hour % 12; if (h12 == 0) h12 = 12;
            char b[40]; snprintf(b, sizeof(b), "Starts at %d:%02d %s", h12, lt.minute, lt.hour >= 12 ? "PM" : "AM");
            id(alarm_start_txt) = b;
          } else {
            id(alarm_start_txt) = id(alarm_preview) != 0 ? "Starts at 8:15 AM" : "";
          }

          // snooze countdown
          id(alarm_back_txt) = "";
          if (id(alarm_state) == 2) {
            time_t f;
            if (id(alarm_preview) == 2) id(alarm_back_txt) = "Back in 4:32";
            else if (now.is_valid() && parse_iso(id(alarm_snooze_finish).state, f)) {
              long rem = (long) f - (long) now.timestamp; if (rem < 0) rem = 0;
              char b[24]; snprintf(b, sizeof(b), "Back in %ld:%02ld", rem / 60, rem % 60);
              id(alarm_back_txt) = b;
            }
          }
      - lvgl.label.update: {id: alarm_time_lbl, text: !lambda 'return id(alarm_time_txt);'}
      - lvgl.label.update: {id: alarm_ampm_lbl, text: !lambda 'return id(alarm_ampm_txt);'}
      - lvgl.label.update: {id: alarm_what_lbl, text: !lambda 'return id(alarm_what_txt);'}
      - lvgl.label.update: {id: alarm_start_lbl, text: !lambda 'return id(alarm_start_txt);'}
      - lvgl.label.update: {id: alarm_back_lbl, text: !lambda 'return id(alarm_back_txt);'}

  # Hold-to-dismiss: a red fill sweeps across in ~0.9 s; letting go early cancels.
  # Dismiss runs "stop for today" (also cancels the 2nd alarm), hence the hold.
  - id: alarm_hold
    mode: restart
    then:
      - repeat:
          count: 18
          then:
            - lvgl.bar.update: {id: alarm_hold_bar, value: !lambda 'return (iteration + 1) * 100 / 18;'}
            - delay: 50ms
      - homeassistant.action: {action: script.turn_on, data: {entity_id: script.work_alarm_stop}}
      - lvgl.bar.update: {id: alarm_hold_bar, value: 0}

  - id: alarm_preview_timeout
    mode: restart
    then:
      - delay: 25s
      - lambda: 'id(alarm_preview) = 0;'
      - script.execute: update_alarm
  # --- SCREEN TIMEOUT ---
  # --- IDLE -> NIGHT CLOCK ---------------------------------------------------
  # Every input (touch, knob, button) calls this. If the night clock is
  # showing it wakes the panel; otherwise it (re)starts the idle countdown.
  - id: screen_timeout_timer
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(night_active);'}
          then:
            - script.execute: wake_from_night
          else:
            - script.execute: apply_awake_brightness
      - delay: ${night_idle}
      - if:
          condition: {lambda: 'return id(party_mode).state;'}
          then:
            - if:
                condition: {lambda: 'return id(current_mode) != 0;'}
                then: [{script.execute: switch_to_media}]
          else:
          - if:
              # hold the screen on while an alarm is ringing
              condition: {lambda: 'return id(alarm_state) != 1;'}
              then: [{script.execute: enter_night}]

  # Awake brightness: full, or 50% while the TV is the source. Never touches
  # the backlight while the night clock is up (a track change must not wake it).
  - id: apply_awake_brightness
    then:
      - if:
          condition: {lambda: 'return !id(night_active);'}
          then:
            - light.control:
                id: display_backlight
                brightness: !lambda 'return id(media_is_tv) ? 0.5f : 1.0f;'

  - id: enter_night
    then:
      - if:
          condition: {lambda: 'return !id(party_mode).state;'}
          then:
          - lambda: |-
              id(night_active) = true;
              id(current_mode) = 9;     // inert: knob/button handlers match no page
              id(nav_level) = 0;
          - script.execute: update_night_clock
          - lvgl.widget.show: grp_night
          - light.control:
              id: display_backlight
              brightness: !lambda 'return id(night_brightness).state / 100.0f;'

  - id: wake_from_night
    mode: restart
    then:
      - lambda: 'id(night_active) = false;'
      - light.control:
          id: display_backlight
          brightness: !lambda 'return id(media_is_tv) ? 0.5f : 1.0f;'
      # The waking touch / turn / press is swallowed: current_mode stays
      # inert for a moment, then the panel returns to the home screen.
      - delay: 350ms
      - lvgl.widget.hide: grp_night
      - if:
          condition: {lambda: 'return id(alarm_popup_up);'}
          then: [{lambda: 'id(current_mode) = 9;'}]
          else: [{script.execute: switch_to_home}]

  - id: update_night_clock
    then:
      - lvgl.label.update:
          id: night_clock_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char b[8];
            snprintf(b, sizeof(b), "%02d:%02d", t.hour, t.minute);
            return std::string(b);
      - lvgl.label.update:
          id: night_date_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid() || t.day_of_week < 1 || t.day_of_week > 7 ||
                t.month < 1 || t.month > 12) return std::string("");
            static const char *const days[] = {"Sunday", "Monday", "Tuesday",
              "Wednesday", "Thursday", "Friday", "Saturday"};
            static const char *const months[] = {"January", "February", "March",
              "April", "May", "June", "July", "August", "September", "October",
              "November", "December"};
            char b[40];
            snprintf(b, sizeof(b), "%s %d %s", days[t.day_of_week - 1],
                     (int) t.day_of_month, months[t.month - 1]);
            return std::string(b);

  # ══════════════════════════════════════════════════════════════════
  # NAVIGATION MODEL
  #   nav_level 0 = Home wheel        (current_mode 3)
  #   nav_level 1 = section wheel     (Media 0 / Lights 1 / Climate 2 /
  #                                    Scenes 4 / Blinds 5)
  #   nav_level 2 = control page      (Light control, Blind control)
  #   Short press or centre touch -> primary_action
  #   Long press                  -> go_back (one step up)
  # ══════════════════════════════════════════════════════════════════
  - id: hide_all_pages
    then:
      - lvgl.widget.hide: grp_home
      - lvgl.widget.hide: grp_bc_home
      - lvgl.widget.hide: grp_bc_lights
      - lvgl.widget.hide: grp_bc_blinds
      - lvgl.widget.hide: grp_lights_wheel
      - lvgl.widget.hide: grp_light_ctl
      - lvgl.widget.hide: grp_scenes
      - lvgl.widget.hide: grp_climate
      - lvgl.widget.hide: grp_blinds_wheel
      - lvgl.widget.hide: grp_blind_ctl
      - lvgl.widget.hide: grp_media_btns
      - lvgl.widget.hide: grp_playlists
      - lvgl.widget.hide: grp_speakers
      - lvgl.widget.hide: vinyl_group
      - lvgl.widget.hide: title_label
      - lvgl.widget.hide: artist_label
      - lvgl.widget.hide: center_btn

  # --- PAGE: HOME ---
  - id: switch_to_home
    then:
      - if:
          condition: {lambda: 'return id(party_mode).state;'}
          then: [{script.execute: switch_to_media}]
          else:
          - lambda: 'id(current_mode) = 3; id(nav_level) = 0;'
          - script.execute: hide_all_pages
          - lvgl.arc.update: {id: main_arc, value: 0}
          - lvgl.widget.show: grp_home
          - lvgl.widget.show: center_btn
          - script.execute: update_clock
          - script.execute: update_home_menu
          - script.execute: update_home_wheel

  # --- PAGE: LIGHTS (wheel of lights) ---
  - id: switch_to_lights
    then:
      - lambda: 'id(current_mode) = 1; id(nav_level) = 1;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_bc_home
      - lvgl.widget.show: grp_lights_wheel
      - lvgl.widget.show: center_btn
      - script.execute: update_lights_wheel

  # --- PAGE: LIGHT CONTROL ---
  - id: enter_light_ctl
    then:
      - lambda: 'id(current_mode) = 1; id(nav_level) = 2;'
      - script.execute: hide_all_pages
      - lvgl.widget.show: grp_bc_lights
      - lvgl.widget.show: grp_light_ctl
      - lvgl.widget.show: center_btn
      - lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0x34E3D1}}
      - script.execute: update_light_ui

  # --- PAGE: SCENES ---
  - id: switch_to_scenes
    then:
      - lambda: 'id(current_mode) = 4; id(nav_level) = 1;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_bc_home
      - lvgl.widget.show: grp_scenes
      - lvgl.widget.show: center_btn
      - script.execute: update_scenes_ui

  # --- PAGE: CLIMATE ---
  - id: switch_to_climate
    then:
      - lambda: 'id(current_mode) = 2; id(nav_level) = 1;'
      - script.execute: hide_all_pages
      - lvgl.widget.show: grp_bc_home
      - lvgl.widget.show: grp_climate
      - lvgl.widget.show: center_btn
      - lvgl.arc.update:
          id: main_arc
          value: !lambda 'return (int)((id(target_temp_val) - 16.0f) * 100.0f / 14.0f);'
      - script.execute: update_climate_wheel

  # --- PAGE: BLINDS (wheel of two blinds) ---
  - id: switch_to_blinds
    then:
      - lambda: 'id(current_mode) = 5; id(nav_level) = 1;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_bc_home
      - lvgl.widget.show: grp_blinds_wheel
      - lvgl.widget.show: center_btn
      - script.execute: update_blinds_wheel

  # --- PAGE: BLIND CONTROL ---
  - id: enter_blind_ctl
    then:
      - lambda: 'id(current_mode) = 5; id(nav_level) = 2;'
      - script.execute: hide_all_pages
      - lvgl.widget.show: grp_bc_blinds
      - lvgl.widget.show: grp_blind_ctl
      - lvgl.widget.show: center_btn
      - lvgl.label.update:
          id: blind_name_lbl
          text: !lambda |-
            switch (id(blind_sel)) {
              case 0:  return std::string("BEDROOM");
              case 1:  return std::string("CLUB");
              case 2:  return std::string("CLUB SHEER");
              default: return std::string("ALL BLINDS");
            }
      - lvgl.arc.update:
          id: main_arc
          indicator: {arc_color: 0x7DD3FC}
          value: !lambda |-
            float p;
            switch (id(blind_sel)) {
              case 0:  p = id(ha_bed_blinds_pos).state; break;
              case 2:  p = id(ha_sheer_blinds_pos).state; break;
              default: p = id(ha_blinds_position).state; break;
            }
            if (isnan(p)) return 0;
            // Sheer reports inverted in HA
            return id(blind_sel) == 2 ? 100 - (int)p : (int)p;
      - script.execute: update_blind_state_lbl

  # --- PAGE: MEDIA ---
  - id: switch_to_media
    then:
      - lambda: 'id(current_mode) = 0; id(nav_level) = 1;'
      - script.execute: hide_all_pages
      - lvgl.arc.update:
          id: main_arc
          indicator: {arc_color: 0x34E3D1}
          value: !lambda |-
            float v = id(ha_media_volume).state;
            return isnan(v) ? 50 : (int)(v * 100.0f);
      - lvgl.widget.show: vinyl_group
      - lvgl.widget.show: grp_media_btns
      - lvgl.widget.show: center_btn
      - lvgl.widget.show: title_label
      - lvgl.widget.show: artist_label
      - if:
          condition: {lambda: 'return id(media_is_tv);'}
          then:
            - lvgl.widget.hide: title_label
            - lvgl.widget.hide: artist_label

  # --- PAGE: PLAYLISTS (Media sub-page) ---
  - id: switch_to_playlists
    then:
      - lambda: 'id(current_mode) = 6; id(nav_level) = 2;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_playlists

  # --- PAGE: SPEAKERS (Media sub-page) ---
  - id: switch_to_speakers
    then:
      - lambda: 'id(current_mode) = 7; id(nav_level) = 2;'
      - script.execute: hide_all_pages
      - lvgl.arc.update: {id: main_arc, value: 0}
      - lvgl.widget.show: grp_speakers

  # --- PRIMARY ACTION (short press / centre touch) ---
  # State is captured into pa_mode first so a page switch inside one branch
  # can't retrigger a later branch.
  - id: primary_action
    then:
      - lambda: 'id(pa_mode) = id(current_mode) * 10 + id(nav_level);'
      - if: {condition: {lambda: 'return id(pa_mode) == 30;'}, then: [{script.execute: open_home_selection}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 11;'}, then: [{script.execute: enter_light_ctl}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 12;'}, then: [{script.execute: call_light_toggle}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 41;'}, then: [{script.execute: activate_scene}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 1;'}, then: [{homeassistant.service: {service: media_player.media_play_pause, data: {entity_id: media_player.club}}}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 21;'}, then: [{homeassistant.service: {service: climate.toggle, data: {entity_id: climate.aircon}}}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 51;'}, then: [{script.execute: enter_blind_ctl}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 52 && id(blind_sel) == 0;'}, then: [{homeassistant.service: {service: cover.stop_cover, data: {entity_id: cover.smart_blinds_curtain}}}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 52 && id(blind_sel) == 1;'}, then: [{homeassistant.service: {service: cover.stop_cover, data: {entity_id: cover.blinds}}}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 52 && id(blind_sel) == 2;'}, then: [{homeassistant.service: {service: cover.stop_cover, data: {entity_id: cover.club_sheer_blinds}}}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 52 && id(blind_sel) == 3;'}, then: [{homeassistant.service: {service: cover.stop_cover, data: {entity_id: "cover.smart_blinds_curtain,cover.blinds,cover.club_sheer_blinds"}}}]}

  # --- GO BACK (long press): control -> wheel -> home ---
  - id: go_back
    then:
      - lambda: 'id(pa_mode) = id(current_mode) * 10 + id(nav_level);'
      - if: {condition: {lambda: 'return id(pa_mode) == 12;'}, then: [{script.execute: switch_to_lights}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 52;'}, then: [{script.execute: switch_to_blinds}]}
      - if: {condition: {lambda: 'return id(pa_mode) == 62 || id(pa_mode) == 72;'}, then: [{script.execute: switch_to_media}]}
      - if: {condition: {lambda: 'return id(pa_mode) % 10 == 1;'}, then: [{script.execute: switch_to_home}]}

  # --- HOME helpers ---
  - id: update_home_menu
    then:
      - lvgl.label.update:
          id: home_menu_lbl
          text: !lambda |-
            switch (id(home_menu_idx)) {
              case 0: return std::string("LIGHTS");
              case 1: return std::string("SCENES");
              case 2: return std::string("MEDIA");
              case 3: return std::string("CLIMATE");
              default: return std::string("BLINDS");
            }
      # MEDIA wedge overrides the title with now-playing info
      - script.execute: update_home_media

  # Home page + MEDIA wedge: fade the record in behind the wheel and swap the
  # "MEDIA" caption for the current track. Safe to call from anywhere — it
  # checks the page itself and tidies up when Media isn't the selection.
  - id: update_home_media
    then:
      - if:
          condition: {lambda: 'return id(current_mode) == 3 && id(home_menu_idx) == 2;'}
          then:
            - lvgl.widget.show: grp_home_vinyl
            # Only a playing (non-TV) source makes the record spin
            - if:
                condition: {lambda: 'return id(media_playing) && !id(media_is_tv);'}
                then:
                  - lvgl.widget.show: hv_sheen_outer
                  - lvgl.widget.show: hv_sheen_inner
                else:
                  - lvgl.widget.hide: hv_sheen_outer
                  - lvgl.widget.hide: hv_sheen_inner
            - lvgl.label.update:
                id: home_menu_lbl
                text: !lambda |-
                  if (id(media_is_tv)) return std::string("TV");
                  std::string t = id(media_title).state;
                  if (t.empty() || t == "unknown" || t == "unavailable" || t == "None")
                    return std::string("MEDIA");
                  return t;
            - lvgl.label.update:
                id: home_np_artist
                text: !lambda |-
                  if (id(media_is_tv)) return std::string("");
                  std::string a = id(media_artist).state;
                  if (a == "unknown" || a == "unavailable" || a == "None")
                    return std::string("");
                  return a;
            - if:
                condition:
                  lambda: |-
                    if (id(media_is_tv)) return false;
                    std::string a = id(media_artist).state;
                    return !(a.empty() || a == "unknown" || a == "unavailable" || a == "None");
                then: [{lvgl.widget.show: home_np_artist}]
                else: [{lvgl.widget.hide: home_np_artist}]
          else:
            - lvgl.widget.hide: grp_home_vinyl
            - lvgl.widget.hide: home_np_artist

  - id: open_home_selection
    then:
      - if: {condition: {lambda: 'return id(home_menu_idx) == 0;'}, then: [{script.execute: switch_to_lights}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 1;'}, then: [{script.execute: switch_to_scenes}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 2;'}, then: [{script.execute: switch_to_media}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 3;'}, then: [{script.execute: switch_to_climate}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 4;'}, then: [{script.execute: switch_to_blinds}]}

  # Selected wedge lights up in its neon colour; the rest keep a subtle tint.
  - id: update_home_wheel
    then:
      - if: {condition: {lambda: 'return id(home_menu_idx) == 0;'}, then: [{lvgl.arc.update: {id: home_arc0, arc_color: 0x8A6714}}], else: [{lvgl.arc.update: {id: home_arc0, arc_color: 0x241C08}}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 1;'}, then: [{lvgl.arc.update: {id: home_arc1, arc_color: 0x53347A}}], else: [{lvgl.arc.update: {id: home_arc1, arc_color: 0x1C1226}}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 2;'}, then: [{lvgl.arc.update: {id: home_arc2, arc_color: 0x14706A}}], else: [{lvgl.arc.update: {id: home_arc2, arc_color: 0x0A211F}}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 3;'}, then: [{lvgl.arc.update: {id: home_arc3, arc_color: 0x225780}}], else: [{lvgl.arc.update: {id: home_arc3, arc_color: 0x0D1E2C}}]}
      - if: {condition: {lambda: 'return id(home_menu_idx) == 4;'}, then: [{lvgl.arc.update: {id: home_arc4, arc_color: 0x365878}}], else: [{lvgl.arc.update: {id: home_arc4, arc_color: 0x131E29}}]}

  - id: update_clock
    then:
      - lvgl.label.update:
          id: home_clock_lbl
          text: !lambda |-
            auto t = id(ha_time).now();
            if (!t.is_valid()) return std::string("--:--");
            char buf[8];
            snprintf(buf, sizeof(buf), "%2d:%02d", t.hour, t.minute);
            return std::string(buf);

  # --- LIGHTS wheel helper: highlight the cursor wedge + centre name ---
  - id: update_lights_wheel
    then:
      - if: {condition: {lambda: 'return id(selected_light_idx) == 0;'}, then: [{lvgl.arc.update: {id: lw_arc0, arc_color: 0xA87C24}}], else: [{lvgl.arc.update: {id: lw_arc0, arc_color: 0x4A3810}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 1;'}, then: [{lvgl.arc.update: {id: lw_arc1, arc_color: 0xA85C24}}], else: [{lvgl.arc.update: {id: lw_arc1, arc_color: 0x4A2C10}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 2;'}, then: [{lvgl.arc.update: {id: lw_arc2, arc_color: 0x963A78}}], else: [{lvgl.arc.update: {id: lw_arc2, arc_color: 0x421836}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 3;'}, then: [{lvgl.arc.update: {id: lw_arc3, arc_color: 0x6B51A8}}], else: [{lvgl.arc.update: {id: lw_arc3, arc_color: 0x2C2148}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 4;'}, then: [{lvgl.arc.update: {id: lw_arc4, arc_color: 0x5C8C44}}], else: [{lvgl.arc.update: {id: lw_arc4, arc_color: 0x24401C}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 5;'}, then: [{lvgl.arc.update: {id: lw_arc5, arc_color: 0x2E8C82}}], else: [{lvgl.arc.update: {id: lw_arc5, arc_color: 0x123C36}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 6;'}, then: [{lvgl.arc.update: {id: lw_arc6, arc_color: 0x96404E}}], else: [{lvgl.arc.update: {id: lw_arc6, arc_color: 0x441C22}}]}
      - lvgl.label.update:
          id: lw_name
          text: !lambda |-
            switch (id(selected_light_idx)) {
              case 0: return std::string("Art");
              case 1: return std::string("Downs");
              case 2: return std::string("LEDs");
              case 3: return std::string("Accent");
              case 4: return std::string("Kitchen");
              case 5: return std::string("Bar");
              default: return std::string("Candles");
            }

  # --- SCENES wheel helper ---
  - id: update_scenes_ui
    then:
      - if: {condition: {lambda: 'return id(selected_scene) == 0;'}, then: [{lvgl.arc.update: {id: scene_arc0, arc_color: 0xE2E8F0}}], else: [{lvgl.arc.update: {id: scene_arc0, arc_color: 0x969CA6}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 1;'}, then: [{lvgl.arc.update: {id: scene_arc1, arc_color: 0xB388E0}}], else: [{lvgl.arc.update: {id: scene_arc1, arc_color: 0x7E60A0}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 2;'}, then: [{lvgl.arc.update: {id: scene_arc2, arc_color: 0x6D8FD8}}], else: [{lvgl.arc.update: {id: scene_arc2, arc_color: 0x3A4A7A}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 3;'}, then: [{lvgl.arc.update: {id: scene_arc3, arc_color: 0xF0B44E}}], else: [{lvgl.arc.update: {id: scene_arc3, arc_color: 0xA88434}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 4;'}, then: [{lvgl.arc.update: {id: scene_arc4, arc_color: 0x4FE0D0}}], else: [{lvgl.arc.update: {id: scene_arc4, arc_color: 0x2E8C82}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 5;'}, then: [{lvgl.arc.update: {id: scene_arc5, arc_color: 0xE05656}}], else: [{lvgl.arc.update: {id: scene_arc5, arc_color: 0x803C3C}}]}
      - lvgl.label.update:
          id: scenes_name_lbl
          text: !lambda |-
            switch (id(selected_scene)) {
              case 0: return std::string("WHITE");
              case 1: return std::string("BAE");
              case 2: return std::string("NIGHT");
              case 3: return std::string("DAY");
              case 4: return std::string("CLUB");
              default: return std::string("OFF");
            }

  - id: activate_scene
    then:
      - if: {condition: {lambda: 'return id(selected_scene) == 0;'}, then: [{homeassistant.service: {service: scene.turn_on, data: {entity_id: scene.white}}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 1;'}, then: [{homeassistant.service: {service: script.turn_on, data: {entity_id: script.bae_2}}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 2;'}, then: [{homeassistant.service: {service: scene.turn_on, data: {entity_id: scene.night}}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 3;'}, then: [{homeassistant.service: {service: script.turn_on, data: {entity_id: script.day}}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 4;'}, then: [{homeassistant.service: {service: script.turn_on, data: {entity_id: script.club}}}]}
      - if: {condition: {lambda: 'return id(selected_scene) == 5;'}, then: [{homeassistant.service: {service: script.turn_on, data: {entity_id: script.off}}}]}

  # --- CLIMATE wheel helper: wedges light up from live HA state ---
  - id: update_climate_wheel
    then:
      # HVAC modes keep their own hues
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "off";'}, then: [{lvgl.arc.update: {id: cw_arc0, arc_color: 0x6E6E7C}}], else: [{lvgl.arc.update: {id: cw_arc0, arc_color: 0x26262C}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "fan_only";'}, then: [{lvgl.arc.update: {id: cw_arc1, arc_color: 0x46A0B4}}], else: [{lvgl.arc.update: {id: cw_arc1, arc_color: 0x173A40}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "cool";'}, then: [{lvgl.arc.update: {id: cw_arc2, arc_color: 0x4A90E0}}], else: [{lvgl.arc.update: {id: cw_arc2, arc_color: 0x16304C}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "heat";'}, then: [{lvgl.arc.update: {id: cw_arc3, arc_color: 0xE04848}}], else: [{lvgl.arc.update: {id: cw_arc3, arc_color: 0x461818}}]}
      # Fan speeds share one violet hue, brightness rising with speed
      - if: {condition: {lambda: 'return id(ha_climate_fan).state == "low";'}, then: [{lvgl.arc.update: {id: cw_arc4, arc_color: 0x5B47A0}}], else: [{lvgl.arc.update: {id: cw_arc4, arc_color: 0x241C40}}]}
      - if: {condition: {lambda: 'return id(ha_climate_fan).state == "auto";'}, then: [{lvgl.arc.update: {id: cw_arc5, arc_color: 0x7A5FD0}}], else: [{lvgl.arc.update: {id: cw_arc5, arc_color: 0x2E2452}}]}
      - if: {condition: {lambda: 'return id(ha_climate_fan).state == "high";'}, then: [{lvgl.arc.update: {id: cw_arc6, arc_color: 0x9B7DF0}}], else: [{lvgl.arc.update: {id: cw_arc6, arc_color: 0x392C63}}]}
      # Temperature arc takes the colour of the active mode
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "heat";'}, then: [{lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0xE04848}}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "cool";'}, then: [{lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0x4A90E0}}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "fan_only";'}, then: [{lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0x46A0B4}}}]}
      - if: {condition: {lambda: 'return id(ha_climate_state).state == "off";'}, then: [{lvgl.arc.update: {id: main_arc, indicator: {arc_color: 0x6E6E7C}}}]}

  # --- BLINDS wheel helper ---
  - id: update_blinds_wheel
    then:
      - if: {condition: {lambda: 'return id(blind_sel) == 0;'}, then: [{lvgl.arc.update: {id: bw_arc0, arc_color: 0x5568B4}}], else: [{lvgl.arc.update: {id: bw_arc0, arc_color: 0x232C52}}]}
      - if: {condition: {lambda: 'return id(blind_sel) == 1;'}, then: [{lvgl.arc.update: {id: bw_arc1, arc_color: 0x2E8C82}}], else: [{lvgl.arc.update: {id: bw_arc1, arc_color: 0x123C36}}]}
      - if: {condition: {lambda: 'return id(blind_sel) == 2;'}, then: [{lvgl.arc.update: {id: bw_arc2, arc_color: 0x7E60A0}}], else: [{lvgl.arc.update: {id: bw_arc2, arc_color: 0x35284A}}]}
      - if: {condition: {lambda: 'return id(blind_sel) == 3;'}, then: [{lvgl.arc.update: {id: bw_arc3, arc_color: 0xA87C24}}], else: [{lvgl.arc.update: {id: bw_arc3, arc_color: 0x4A2C10}}]}

  - id: update_blind_state_lbl
    then:
      - lvgl.label.update:
          id: climate_blinds_state
          text: !lambda |-
            std::string s;
            switch (id(blind_sel)) {
              case 0:  s = id(ha_bed_blinds_state).state; break;
              case 2:  s = id(ha_sheer_blinds_state).state; break;
              default: s = id(ha_blinds_state).state; break;
            }
            for (auto &c : s) c = toupper((unsigned char)c);
            // Sheer reports inverted in HA: flip the words back to reality
            if (id(blind_sel) == 2) {
              if      (s == "OPEN")    s = "CLOSED";
              else if (s == "CLOSED")  s = "OPEN";
              else if (s == "OPENING") s = "CLOSING";
              else if (s == "CLOSING") s = "OPENING";
            }
            return s;

  # --- LIGHT HELPERS ---
  - id: update_light_ui
    then:
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 2;'}
          then:
            - lambda: |-
                if (id(selected_light_idx) == 0) {
                  id(lights_bright_val) = id(lights_bright_art);
                } else if (id(selected_light_idx) == 1) {
                  id(lights_bright_val) = id(lights_bright_down);
                } else if (id(selected_light_idx) == 2) {
                  id(lights_bright_val) = id(lights_bright_leds);
                } else if (id(selected_light_idx) == 3) {
                  id(lights_bright_val) = id(lights_bright_accent);
                } else if (id(selected_light_idx) == 4) {
                  id(lights_bright_val) = id(lights_bright_kitchen);
                } else if (id(selected_light_idx) == 5) {
                  id(lights_bright_val) = id(lights_bright_bar);
                } else if (id(selected_light_idx) == 6) {
                  id(lights_bright_val) = id(lights_bright_candles);
                }
            - lvgl.arc.update:
                id: main_arc
                value: !lambda 'return (int)id(lights_bright_val);'
            - lvgl.label.update:
                id: lights_pct_label
                text: !lambda |-
                  char buf[8];
                  snprintf(buf, sizeof(buf), "%d%%", (int)id(lights_bright_val));
                  return buf;
            - lvgl.label.update:
                id: lights_name_lbl
                text: !lambda |-
                  if (id(selected_light_idx) == 0) return "ART PENDANTS";
                  if (id(selected_light_idx) == 1) return "DOWNLIGHTS";
                  if (id(selected_light_idx) == 2) return "LEDS";
                  if (id(selected_light_idx) == 3) return "ACCENT";
                  if (id(selected_light_idx) == 4) return "KITCHEN";
                  if (id(selected_light_idx) == 5) return "BAR";
                  if (id(selected_light_idx) == 6) return "CANDLES";
                  return "";

  - id: call_light_turn_on
    mode: restart
    then:
      - delay: 200ms
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 0 && !std::isnan(id(lights_bright_art));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_art) <= 0;'}
                then: [{homeassistant.service: {service: light.turn_off, data: {entity_id: light.art_group}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.art_group}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_art);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 1 && !std::isnan(id(lights_bright_down));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_down) <= 0;'}
                then: [{homeassistant.service: {service: light.turn_off, data: {entity_id: light.downlights}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.downlights}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_down);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 2 && !std::isnan(id(lights_bright_leds));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_leds) <= 0;'}
                then: [{homeassistant.service: {service: light.turn_off, data: {entity_id: light.club_led_group}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.club_led_group}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_leds);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 3 && !std::isnan(id(lights_bright_accent));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_accent) <= 0;'}
                then: [{homeassistant.service: {service: light.turn_off, data: {entity_id: light.club_accent_lights}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.club_accent_lights}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_accent);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 4 && !std::isnan(id(lights_bright_kitchen));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_kitchen) <= 0;'}
                then: [{homeassistant.service: {service: light.turn_off, data: {entity_id: light.kitchen}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.kitchen}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_kitchen);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 5 && !std::isnan(id(lights_bright_bar));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_bar) <= 0;'}
                then: [{homeassistant.service: {service: light.turn_off, data: {entity_id: light.bar_lights}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.bar_lights}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_bar);'}
      - if:
          condition: {lambda: 'return id(selected_light_idx) == 6 && !std::isnan(id(lights_bright_candles));'}
          then:
            - if:
                condition: {lambda: 'return id(lights_bright_candles) <= 0;'}
                then: [{homeassistant.service: {service: light.turn_off, data: {entity_id: light.kitchen_console_candles}}}]
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data: {entity_id: light.kitchen_console_candles}
                      data_template: {brightness_pct: "{{ pct }}"}
                      variables: {pct: !lambda 'return id(lights_bright_candles);'}

  - id: call_light_toggle
    then:
      - if: {condition: {lambda: 'return id(selected_light_idx) == 0;'}, then: [{homeassistant.service: {service: light.toggle, data: {entity_id: light.art_group}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 1;'}, then: [{homeassistant.service: {service: light.toggle, data: {entity_id: light.downlights}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 2;'}, then: [{homeassistant.service: {service: light.toggle, data: {entity_id: light.club_led_group}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 3;'}, then: [{homeassistant.service: {service: light.toggle, data: {entity_id: light.club_accent_lights}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 4;'}, then: [{homeassistant.service: {service: light.toggle, data: {entity_id: light.kitchen}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 5;'}, then: [{homeassistant.service: {service: light.toggle, data: {entity_id: light.bar_lights}}}]}
      - if: {condition: {lambda: 'return id(selected_light_idx) == 6;'}, then: [{homeassistant.service: {service: light.toggle, data: {entity_id: light.kitchen_console_candles}}}]}

  - id: update_climate_temp
    mode: restart
    parameters:
      new_temp: float
    then:
      - delay: 400ms
      - homeassistant.action:
          action: climate.set_temperature
          data: {entity_id: climate.aircon}
          data_template: {temperature: "{{ temp }}"}
          variables:
            temp: !lambda 'return new_temp;'


# --------------------------------------------------------
# VINYL SPIN LOOP
# Rotates the centre label while music plays (Media page only).
# --------------------------------------------------------
interval:
  # --- work alarm: pulse + clock + countdown twice a second while the popup is up
  - interval: 500ms
    then:
      - if:
          condition: {lambda: 'return id(alarm_popup_up);'}
          then:
            - script.execute: alarm_refresh_text
            - if:
                condition: {lambda: 'return id(alarm_state) == 1;'}
                then:
                  - lambda: 'id(alarm_pulse) = !id(alarm_pulse);'
                  - if:
                      condition: {lambda: 'return id(alarm_pulse);'}
                      then: [{lvgl.obj.update: {id: alarm_icon_bg, bg_opa: 70%}}]
                      else: [{lvgl.obj.update: {id: alarm_icon_bg, bg_opa: 25%}}]
  # --- work alarm: while RINGING, keep the screen on even if someone hits sleep
  - interval: 20s
    then:
      - if:
          condition: {lambda: 'return id(alarm_state) == 1;'}
          then:
            - lambda: 'id(night_active) = false;'
            - lvgl.widget.hide: grp_night
            - light.control: {id: display_backlight, brightness: 100%}
  # --- night clock: tick the faded clock, and arm the idle timer once after boot
  - interval: 5s
    then:
      - if:
          condition: {lambda: 'return id(night_active);'}
          then: [{script.execute: update_night_clock}]
      - if:
          condition: {lambda: 'return !id(night_armed);'}
          then:
            - lambda: 'id(night_armed) = true;'
            - script.execute: screen_timeout_timer
  - interval: 50ms
    then:
      - if:
          condition:
            lambda: 'return id(media_playing) && id(current_mode) == 0 && !id(media_is_tv);'
          then:
            - lambda: |-
                id(vinyl_angle) += 60;              // 6°/tick ≈ 120°/s (tune to taste)
                if (id(vinyl_angle) >= 3600) id(vinyl_angle) -= 3600;
            - lvgl.image.update:
                id: media_logo
                angle: !lambda 'return id(vinyl_angle);'

# --------------------------------------------------------
# CLOCK (Home page)
# --------------------------------------------------------
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: '*'
        then:
          - script.execute: update_clock

# --------------------------------------------------------
# INPUTS
# --------------------------------------------------------
binary_sensor:
  # --- auto-stay (party mode): lock to the Sonos page, no night clock
  - platform: homeassistant
    id: party_mode
    entity_id: input_boolean.auto_stay
    on_press:
      then:
        - if:
            condition: {lambda: 'return id(night_active);'}
            then:
              - lvgl.widget.hide: grp_night
              - lambda: 'id(night_active) = false;'
        - script.execute: switch_to_media
        - script.execute: screen_timeout_timer
    on_release:
      then:
        - script.execute: switch_to_home
        - script.execute: screen_timeout_timer
  # --- work alarm (mirrors Home Assistant)
  - platform: homeassistant
    id: alarm_ringing
    entity_id: input_boolean.work_alarm_ringing
    on_state:
      then:
        - script.execute: update_alarm
  - platform: gpio
    id: rotary_button
    pin:
      pcf8574: pcf
      number: 5
      mode: INPUT
      inverted: true
    on_multi_click:
      # --- DOUBLE CLICK: Media = next track ---
      - timing:
          - ON for at most 400ms
          - OFF for at most 400ms
          - ON for at most 400ms
          - OFF for at least 400ms
        then:
          - script.execute: screen_timeout_timer
          - if:
              condition: {lambda: 'return id(current_mode) == 0;'}
              then:
                - homeassistant.action:
                    action: media_player.media_next_track
                    data: {entity_id: media_player.club}
      # --- SINGLE CLICK: same as touching the centre ---
      - timing:
          - ON for 50ms to 400ms
          - OFF for at least 400ms
        then:
          - script.execute: screen_timeout_timer
          - script.execute: primary_action
      # --- LONG PRESS: back one step ---
      - timing:
          - ON for at least 600ms
        then:
          - script.execute: screen_timeout_timer
          - script.execute: go_back


sensor:
  - platform: rotary_encoder
    id: rotary_dial
    pin_a:
      number: 4
      mode: INPUT_PULLUP
    pin_b:
      number: 42
      mode: INPUT_PULLUP
    on_clockwise:
      - script.execute: screen_timeout_timer
      # Home: next wedge
      - if:
          condition: {lambda: 'return id(current_mode) == 3;'}
          then:
            - lambda: 'id(home_menu_idx) = (id(home_menu_idx) + 1) % 5;'
            - script.execute: update_home_menu
            - script.execute: update_home_wheel
      # Lights wheel: next light
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 1;'}
          then:
            - lambda: 'id(selected_light_idx) = (id(selected_light_idx) + 1) % 7;'
            - script.execute: update_lights_wheel
      # Light control: brightness up
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 2;'}
          then:
            - lambda: |-
                if (id(selected_light_idx) == 0) { id(lights_bright_art) += 10.0f; if (id(lights_bright_art) > 100.0f) id(lights_bright_art) = 100.0f; }
                else if (id(selected_light_idx) == 1) { id(lights_bright_down) += 10.0f; if (id(lights_bright_down) > 100.0f) id(lights_bright_down) = 100.0f; }
                else if (id(selected_light_idx) == 2) { id(lights_bright_leds) += 10.0f; if (id(lights_bright_leds) > 100.0f) id(lights_bright_leds) = 100.0f; }
                else if (id(selected_light_idx) == 3) { id(lights_bright_accent) += 10.0f; if (id(lights_bright_accent) > 100.0f) id(lights_bright_accent) = 100.0f; }
                else if (id(selected_light_idx) == 4) { id(lights_bright_kitchen) += 10.0f; if (id(lights_bright_kitchen) > 100.0f) id(lights_bright_kitchen) = 100.0f; }
                else if (id(selected_light_idx) == 5) { id(lights_bright_bar) += 10.0f; if (id(lights_bright_bar) > 100.0f) id(lights_bright_bar) = 100.0f; }
                else if (id(selected_light_idx) == 6) { id(lights_bright_candles) += 10.0f; if (id(lights_bright_candles) > 100.0f) id(lights_bright_candles) = 100.0f; }
            - script.execute: update_light_ui
            - script.execute: call_light_turn_on
      # Scenes: next scene
      - if:
          condition: {lambda: 'return id(current_mode) == 4;'}
          then:
            - lambda: 'id(selected_scene) = (id(selected_scene) + 1) % 6;'
            - script.execute: update_scenes_ui
      # Media: volume up
      - if:
          condition: {lambda: 'return id(current_mode) == 0;'}
          then:
            - homeassistant.action:
                action: media_player.volume_up
                data: {entity_id: media_player.club}
      # Climate: temperature up
      - if:
          condition: {lambda: 'return id(current_mode) == 2;'}
          then:
            - lambda: |-
                id(target_temp_val) += 1.0f;
                if (id(target_temp_val) > 30.0f) id(target_temp_val) = 30.0f;
            - lvgl.arc.update:
                id: main_arc
                value: !lambda 'return (int)((id(target_temp_val) - 16.0f) * 100.0f / 14.0f);'
            - lvgl.label.update:
                id: target_temp_lbl
                text: !lambda |-
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%.0f°C", id(target_temp_val));
                  return buf;
            - script.execute:
                id: update_climate_temp
                new_temp: !lambda 'return id(target_temp_val);'
      # Blinds wheel: other blind
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 1;'}
          then:
            - lambda: 'id(blind_sel) = (id(blind_sel) + 1) % 4;'
            - script.execute: update_blinds_wheel
      # Blind control: open  (sheer is motor-reversed, so it takes close_cover)
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 0;'}
          then: [{homeassistant.service: {service: cover.open_cover, data: {entity_id: cover.smart_blinds_curtain}}}]
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 1;'}
          then: [{homeassistant.service: {service: cover.open_cover, data: {entity_id: cover.blinds}}}]
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 2;'}
          then: [{homeassistant.service: {service: cover.close_cover, data: {entity_id: cover.club_sheer_blinds}}}]
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 3;'}
          then:
            - homeassistant.action: {action: cover.open_cover,  data: {entity_id: "cover.smart_blinds_curtain,cover.blinds"}}
            - homeassistant.action: {action: cover.close_cover, data: {entity_id: cover.club_sheer_blinds}}

    on_anticlockwise:
      - script.execute: screen_timeout_timer
      # Home: previous wedge
      - if:
          condition: {lambda: 'return id(current_mode) == 3;'}
          then:
            - lambda: 'id(home_menu_idx) = (id(home_menu_idx) + 4) % 5;'
            - script.execute: update_home_menu
            - script.execute: update_home_wheel
      # Lights wheel: previous light
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 1;'}
          then:
            - lambda: 'id(selected_light_idx) = (id(selected_light_idx) + 6) % 7;'
            - script.execute: update_lights_wheel
      # Light control: brightness down
      - if:
          condition: {lambda: 'return id(current_mode) == 1 && id(nav_level) == 2;'}
          then:
            - lambda: |-
                if (id(selected_light_idx) == 0) { id(lights_bright_art) -= 10.0f; if (id(lights_bright_art) < 0.0f) id(lights_bright_art) = 0.0f; }
                else if (id(selected_light_idx) == 1) { id(lights_bright_down) -= 10.0f; if (id(lights_bright_down) < 0.0f) id(lights_bright_down) = 0.0f; }
                else if (id(selected_light_idx) == 2) { id(lights_bright_leds) -= 10.0f; if (id(lights_bright_leds) < 0.0f) id(lights_bright_leds) = 0.0f; }
                else if (id(selected_light_idx) == 3) { id(lights_bright_accent) -= 10.0f; if (id(lights_bright_accent) < 0.0f) id(lights_bright_accent) = 0.0f; }
                else if (id(selected_light_idx) == 4) { id(lights_bright_kitchen) -= 10.0f; if (id(lights_bright_kitchen) < 0.0f) id(lights_bright_kitchen) = 0.0f; }
                else if (id(selected_light_idx) == 5) { id(lights_bright_bar) -= 10.0f; if (id(lights_bright_bar) < 0.0f) id(lights_bright_bar) = 0.0f; }
                else if (id(selected_light_idx) == 6) { id(lights_bright_candles) -= 10.0f; if (id(lights_bright_candles) < 0.0f) id(lights_bright_candles) = 0.0f; }
            - script.execute: update_light_ui
            - script.execute: call_light_turn_on
      # Scenes: previous scene
      - if:
          condition: {lambda: 'return id(current_mode) == 4;'}
          then:
            - lambda: 'id(selected_scene) = (id(selected_scene) + 5) % 6;'
            - script.execute: update_scenes_ui
      # Media: volume down
      - if:
          condition: {lambda: 'return id(current_mode) == 0;'}
          then:
            - homeassistant.action:
                action: media_player.volume_down
                data: {entity_id: media_player.club}
      # Climate: temperature down
      - if:
          condition: {lambda: 'return id(current_mode) == 2;'}
          then:
            - lambda: |-
                id(target_temp_val) -= 1.0f;
                if (id(target_temp_val) < 16.0f) id(target_temp_val) = 16.0f;
            - lvgl.arc.update:
                id: main_arc
                value: !lambda 'return (int)((id(target_temp_val) - 16.0f) * 100.0f / 14.0f);'
            - lvgl.label.update:
                id: target_temp_lbl
                text: !lambda |-
                  char buf[16];
                  snprintf(buf, sizeof(buf), "%.0f°C", id(target_temp_val));
                  return buf;
            - script.execute:
                id: update_climate_temp
                new_temp: !lambda 'return id(target_temp_val);'
      # Blinds wheel: other blind
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 1;'}
          then:
            - lambda: 'id(blind_sel) = (id(blind_sel) + 3) % 4;'
            - script.execute: update_blinds_wheel
      # Blind control: close  (sheer is motor-reversed, so it takes open_cover)
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 0;'}
          then: [{homeassistant.service: {service: cover.close_cover, data: {entity_id: cover.smart_blinds_curtain}}}]
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 1;'}
          then: [{homeassistant.service: {service: cover.close_cover, data: {entity_id: cover.blinds}}}]
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 2;'}
          then: [{homeassistant.service: {service: cover.open_cover, data: {entity_id: cover.club_sheer_blinds}}}]
      - if:
          condition: {lambda: 'return id(current_mode) == 5 && id(nav_level) == 2 && id(blind_sel) == 3;'}
          then:
            - homeassistant.action: {action: cover.close_cover, data: {entity_id: "cover.smart_blinds_curtain,cover.blinds"}}
            - homeassistant.action: {action: cover.open_cover,  data: {entity_id: cover.club_sheer_blinds}}


  # ── HA State Sensors ───────────────────────────────────────────────────────

  - platform: homeassistant
    id: ha_media_volume
    entity_id: media_player.club
    attribute: volume_level
    on_value:
      then:
        - if:
            condition: {lambda: 'return !isnan(x) && id(current_mode) == 0;'}
