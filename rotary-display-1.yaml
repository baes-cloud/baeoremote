  - platform: homeassistant
    id: ha_climate_temp
    entity_id: climate.aircon
    attribute: temperature
    on_value:
      then:
        - lambda: 'id(target_temp_val) = isnan(x) ? 24.0f : x;'
        - lvgl.label.update:
            id: target_temp_lbl
            text: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.0f°C", id(target_temp_val));
              return buf;
        - if:
            condition: {lambda: 'return id(current_mode) == 2;'}
            then:
              - lvgl.arc.update:
                  id: main_arc
                  value: !lambda 'return (int)((id(target_temp_val) - 16.0f) * 100.0f / 14.0f);'

  - platform: homeassistant
    id: ha_climate_current_temp
    entity_id: climate.aircon
    attribute: current_temperature
    on_value:
      then:
        - lvgl.label.update:
            id: current_temp_lbl
            text: !lambda |-
              if (isnan(x)) return "--- °C";
              char buf[16];
              snprintf(buf, sizeof(buf), "%.1f°C", x);
              return buf;

touchscreen:
  - platform: cst816
    id: touch_screen
    on_touch:
      - script.execute: screen_timeout_timer

# --------------------------------------------------------
# DISPLAY & FONTS
# --------------------------------------------------------
spi:
  clk_pin: 2
  mosi_pin: 1

display:
  - platform: st7701s
    id: my_display
    update_interval: 50ms
    spi_mode: MODE3
    dimensions:
      width: 480
      height: 480
    cs_pin: 16
    de_pin: 40
    hsync_pin: 15
    vsync_pin: 7
    pclk_pin: 41
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]
    pclk_frequency: 12MHz
    init_sequence:
      - [0x01]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xCC, 0x10]
